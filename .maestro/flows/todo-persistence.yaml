appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - todos
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'To Do'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- assertVisible: 'Quick add'
# Create through the quick-capture input: the FAB shares its label with the
# disabled submit twin and sits under the command launcher, so neither is a
# stable tap target. returnKeyType=done submits the capture bar.
- tapOn: 'Quick add task title'
- inputText: 'Native persistence todo'
- pressKey: enter
# The new row can be below the first viewport even when the pending count has
# already incremented. Reveal the row before asserting it and again on restart.
- scrollUntilVisible:
    element: 'Native persistence todo'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native persistence todo'
    timeout: 10000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'To Do'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Native persistence todo'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native persistence todo'
    timeout: 15000
