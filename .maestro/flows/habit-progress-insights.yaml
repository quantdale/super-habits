appId: com.dale16.superhabits
tags:
  - native
  - habits
  - habit-progress-insights
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 10000
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native insights habit'
- hideKeyboard
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native insights habit: 0 of 1 today.*'
    timeout: 5000
- tapOn: 'Native insights habit: 0 of 1 today.*'
- extendedWaitUntil:
    visible: 'Native insights habit: 1 of 1 today.*'
    timeout: 5000
- tapOn: 'View progress for Native insights habit'
- extendedWaitUntil:
    visible: 'Native insights habit progress'
    timeout: 5000
- extendedWaitUntil:
    visible: 'Current streak: 1 scheduled occurrence.*'
    timeout: 5000
- assertVisible: 'Longest streak: 1 scheduled occurrence.*'
- assertVisible: 'Scheduled completion rate'
# The recent-history section sits below the rate cards; scroll to it rather
# than asserting off-screen content.
- scrollUntilVisible:
    element: 'Recent target vs actual'
    direction: DOWN
- assertVisible: 'Recent target vs actual'
- scrollUntilVisible:
    element: 'Target met'
    direction: DOWN
- assertVisible: 'Target met'
- tapOn: 'Close'
- assertNotVisible: 'Native insights habit progress'
- tapOn: 'View progress for Native insights habit'
- extendedWaitUntil:
    visible: 'Native insights habit progress'
    timeout: 5000
- assertVisible: 'Current streak: 1 scheduled occurrence.*'
- tapOn: 'Close'
