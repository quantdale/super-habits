appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-replay
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native replay action'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- swipe:
    start: '5%, 85%'
    end: '5%, 50%'
    duration: 500
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- scrollUntilVisible:
    element: 'Native replay action: 0 of 1 today.*'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native replay action: 0 of 1 today.*'
    timeout: 5000
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native replay action'
    direction: DOWN
- tapOn: 'Edit Native replay action'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: DOWN
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: DOWN
- assertVisible: 'Native replay action: 1 of 1 today.*'
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native replay action'
    direction: DOWN
- tapOn: 'Edit Native replay action'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: DOWN
- assertVisible: 'Native replay action: 1 of 1 today.*'
