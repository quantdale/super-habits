appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-replay
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native replay action'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
# Enabling the reminder rebuilds the modal near its top. Reveal the submit
# footer with bounded gestures inside the modal before asserting it.
- repeat:
    times: 8
    while:
      notVisible: 'Create habit'
    commands:
      - swipe:
          start: '85%, 80%'
          end: '85%, 25%'
          duration: 400
- assertVisible: 'Create habit'
- tapOn: 'Create habit'
- scrollUntilVisible:
    element: 'Native replay action: 0 of 1 today.*'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native replay action: 0 of 1 today.*'
    timeout: 5000
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native replay action'
    direction: DOWN
- tapOn: 'Edit Native replay action'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- assertVisible: 'Cancel'
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: UP
    centerElement: true
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- extendedWaitUntil:
    visible: 'Native replay action: 1 of 1 today.*'
    timeout: 15000
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: UP
    centerElement: true
    visibilityPercentage: 50
- assertVisible: 'Native replay action: 1 of 1 today.*'
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native replay action'
    direction: DOWN
- tapOn: 'Edit Native replay action'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- assertVisible: 'Cancel'
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: DOWN
- assertVisible: 'Native replay action: 1 of 1 today.*'
