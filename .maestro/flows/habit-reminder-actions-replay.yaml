appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-replay
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native replay action'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native replay action: 0 of 1 today.*'
    timeout: 5000
- swipe:
    start: '50%, 30%'
    end: '50%, 70%'
    duration: 350
- tapOn: 'Enter habit edit mode'
- tapOn: 'Edit'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- tapOn: 'Exit habit edit mode'
- extendedWaitUntil:
    visible: 'Native replay action: 1 of 1 today.*'
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- assertVisible: 'Native replay action: 1 of 1 today.*'
- swipe:
    start: '50%, 30%'
    end: '50%, 70%'
    duration: 350
- tapOn: 'Enter habit edit mode'
- tapOn: 'Edit'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native replay action: 1 of 1 today.*'
    direction: UP
- assertVisible: 'Native replay action: 1 of 1 today.*'

