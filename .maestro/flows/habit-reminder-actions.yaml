appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-actions
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add habit'
# Index 1 targets the input; index 0 is the label and drops typed text.
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native Gym action'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
# Enabling the reminder rebuilds the modal near its top. Reveal the submit
# footer with bounded gestures inside the modal before asserting it.
- repeat:
    times: 8
    while:
      notVisible: 'Create habit'
    commands:
      - swipe:
          start: '85%, 80%'
          end: '85%, 25%'
          duration: 400
- assertVisible: 'Create habit'
- tapOn: 'Create habit'
# The Habits list retains its prior scroll position; reveal the new tile before
# the progress assertion.
- scrollUntilVisible:
    element: 'Native Gym action: 0 of 1 today.*'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native Gym action: 0 of 1 today.*'
    timeout: 5000
- scrollUntilVisible:
    element: 'Open Native Gym action details'
    direction: UP
- tapOn: 'Open Native Gym action details'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Edit habit'
    direction: DOWN
- tapOn: 'Edit habit'
- scrollUntilVisible:
    element: 'Inject habit reminder tap'
    direction: DOWN
- tapOn: 'Inject habit reminder tap'
- assertVisible: 'Edit Habit'
# The edit-sheet footer is below the fold after the injection controls. Its
# header Close button calls the same reset handler as Cancel.
- tapOn: 'Close'
- scrollUntilVisible:
    element: 'Native Gym action: 0 of 1 today.*'
    direction: DOWN
- assertVisible: 'Native Gym action: 0 of 1 today.*'
- scrollUntilVisible:
    element: 'Open Native Gym action details'
    direction: UP
- tapOn: 'Open Native Gym action details'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Edit habit'
    direction: DOWN
- tapOn: 'Edit habit'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- tapOn: 'Close'
- scrollUntilVisible:
    element: 'Native Gym action: 1 of 1 today.*'
    direction: DOWN
- scrollUntilVisible:
    element: 'Open Native Gym action details'
    direction: UP
- tapOn: 'Open Native Gym action details'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Edit habit'
    direction: DOWN
- tapOn: 'Edit habit'
- scrollUntilVisible:
    element: 'Inject Snooze response'
    direction: DOWN
- tapOn: 'Inject Snooze response'
- tapOn: 'Close'
- scrollUntilVisible:
    element: 'Reminder 18:00'
    direction: DOWN
- assertVisible: 'Reminder 18:00'
