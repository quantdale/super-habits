appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-actions
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native Gym action'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# The Habits list retains its prior scroll position; reveal the new tile before
# the progress assertion.
- scrollUntilVisible:
    element: 'Native Gym action: 0 of 1 today.*'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native Gym action: 0 of 1 today.*'
    timeout: 5000
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native Gym action'
    direction: DOWN
- tapOn: 'Edit Native Gym action'
- scrollUntilVisible:
    element: 'Inject habit reminder tap'
    direction: DOWN
- tapOn: 'Inject habit reminder tap'
- assertVisible: 'Edit Habit'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native Gym action: 0 of 1 today.*'
    direction: DOWN
- assertVisible: 'Native Gym action: 0 of 1 today.*'
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native Gym action'
    direction: DOWN
- tapOn: 'Edit Native Gym action'
- scrollUntilVisible:
    element: 'Inject Mark complete response'
    direction: DOWN
- tapOn: 'Inject Mark complete response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Native Gym action: 1 of 1 today.*'
    direction: DOWN
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native Gym action'
    direction: DOWN
- tapOn: 'Edit Native Gym action'
- scrollUntilVisible:
    element: 'Inject Snooze response'
    direction: DOWN
- tapOn: 'Inject Snooze response'
- scrollUntilVisible:
    element: 'Cancel'
    direction: DOWN
- tapOn: 'Cancel'
- scrollUntilVisible:
    element: 'Exit habit edit mode'
    direction: UP
- tapOn: 'Exit habit edit mode'
- scrollUntilVisible:
    element: 'Reminder 18:00'
    direction: DOWN
- assertVisible: 'Reminder 18:00'
