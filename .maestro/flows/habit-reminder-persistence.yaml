appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - notifications
  - habits
  - habit-v2
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native reminder M-W-F'
- hideKeyboard
- tapOn: 'Custom'
- tapOn: 'Tuesday scheduled'
- tapOn: 'Thursday scheduled'
- tapOn: 'Saturday scheduled'
- tapOn: 'Sunday scheduled'
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- assertVisible: 'Reminder time'
- assertVisible: '18:00'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native reminder M-W-F'
    timeout: 5000
- assertVisible: 'Mon / Wed / Fri'
- assertVisible: 'Reminder 18:00'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- extendedWaitUntil:
    visible: 'Native reminder M-W-F'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Mon / Wed / Fri'
    timeout: 5000
- extendedWaitUntil:
    visible: 'Reminder 18:00'
    timeout: 5000
