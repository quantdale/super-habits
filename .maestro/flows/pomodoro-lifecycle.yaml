appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - pomodoro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Focus'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 5000
# Bring the timer controls on-screen (Maestro synthetic scrollUntilVisible
# does not move the section ScrollView; coordinate swipes do).
- swipe:
    start: '50%, 66%'
    end: '50%, 40%'
    duration: 350
# Ending an in-flight session goes through the end confirmation; the
# destructive action there is labelled "End session".
- tapOn: 'End'
- assertVisible: 'End this focus session?'
- tapOn: 'End session'
- assertVisible: 'Start focus'
