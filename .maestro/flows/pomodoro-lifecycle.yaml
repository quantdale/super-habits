appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - pomodoro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Focus'
    index: 0
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 5000
# Bring the timer controls on-screen (Maestro synthetic scrollUntilVisible
# does not move the section ScrollView; coordinate swipes do).
- swipe:
    start: '50%, 66%'
    end: '50%, 40%'
    duration: 350
# Hardening wave made the abandon control conditional (Reset <60s / Abandon
# after 60s of focus); accept whichever the elapsed time produces.
- tapOn: 'Reset|Abandon'
- assertVisible: 'Start focus'

