appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - pomodoro
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- tapOn: 'Focus'
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'Pause'
    timeout: 5000
- tapOn: 'Reset'
- assertVisible: 'Start focus'
