appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-delivery
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native delivery habit'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native delivery habit'
    timeout: 5000
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native delivery habit'
    direction: DOWN
- tapOn: 'Edit Native delivery habit'
- scrollUntilVisible:
    element: 'Schedule test notification'
    direction: DOWN
- tapOn: 'Schedule test notification'
- pressKey: HOME
- killApp
