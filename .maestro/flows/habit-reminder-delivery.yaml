appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - habit-reminder-delivery
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native delivery habit'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# The Habits list retains its prior scroll position; reveal the new tile before
# opening its edit controls.
- scrollUntilVisible:
    element: 'Native delivery habit'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native delivery habit'
    timeout: 5000
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native delivery habit'
    direction: DOWN
- tapOn: 'Edit Native delivery habit'
- scrollUntilVisible:
    element: 'Schedule test notification'
    direction: DOWN
- tapOn: 'Schedule test notification'
- pressKey: HOME
- killApp
