appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - notifications
  - habits
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native denied reminder'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: UP
- tapOn: 'Enable habit reminder'
- assertVisible: 'Notifications are blocked. Enable them in system settings before saving a reminder.'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native denied reminder'
    timeout: 5000
- assertNotVisible: 'Reminder 18:00'
