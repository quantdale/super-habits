appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - notifications
  - habits
  - pomodoro
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
# Reveal the group tiles (header+stats push them below the fold at top).
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native Gym reminder'
- hideKeyboard
- tapOn: 'Custom'
- tapOn: 'Tuesday scheduled'
- tapOn: 'Thursday scheduled'
- tapOn: 'Saturday scheduled'
- tapOn: 'Sunday scheduled'
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# Undo the form-entry depth, then re-reveal the fresh top row.
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 66%'
    end: '50%, 28%'
    duration: 350
- extendedWaitUntil:
    visible: 'Native Gym reminder'
    timeout: 15000
# Second habit must NOT inherit the first one's reminder.
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
- scrollUntilVisible:
    element: 'Habit name'
    direction: UP
- tapOn: 'Habit name'
- inputText: 'Native Read reminder'
- hideKeyboard
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 66%'
    end: '50%, 28%'
    duration: 350
- extendedWaitUntil:
    visible: 'Native Read reminder'
    timeout: 15000
- assertVisible: 'Native Gym reminder'
- assertVisible: 'Reminder 18:00'
- swipe:
    start: '50%, 30%'
    end: '50%, 70%'
    duration: 350
- tapOn: 'Enter habit edit mode'
- swipe:
    start: '50%, 66%'
    end: '50%, 40%'
    duration: 350
- scrollUntilVisible:
    element: 'Delete Native Gym reminder'
    direction: DOWN
- tapOn: 'Delete Native Gym reminder'
- tapOn: 'Delete habit'
- scrollUntilVisible:
    element: 'Native Read reminder'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native Read reminder'
    timeout: 5000
- assertNotVisible: 'Native Gym reminder'
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- assertNotVisible: 'Reminder 18:00'
- tapOn:
    text: 'Focus'
    index: 0
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: HOME
- launchApp:
    stopApp: false
- assertVisible: 'Pause'
# Elapsed focus time varies with emulator speed; accept either label.
- tapOn: 'Reset (not logged)'
- assertVisible: 'Start focus'
