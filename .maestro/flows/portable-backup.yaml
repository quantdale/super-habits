appId: com.dale16.superhabits
tags:
  - native
  - portable-backup
---
# Portable Backup V1 — native surface on Android.
#
# The full portable export/import pipeline (envelope integrity, validation,
# preview, atomic import, side-effect suppression, owner compatibility) is
# exercised by the web E2E journey (e2e/portable-backup.spec.ts) and the
# real-SQLite integration suite (tests/integration/portable*). This flow pins
# the native surface: the Portable data card under Backup / Sync / Restore,
# the plain-text disclosure, the Export share-sheet path (real OS surface),
# and the Import document picker (real OS surface, cancelled).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Theme and display'
    timeout: 10000
# Scroll within the settings modal in stable anchors to the Portable data card.
# The Appearance theme grids are several screens tall and scrollUntilVisible's
# own steps can be consumed by the pressable cards. Cross the grids with
# explicit side-margin swipes first, then finish with the scoped scroll.
- swipe:
    start: '95%, 75%'
    end: '95%, 25%'
    duration: 300
- swipe:
    start: '95%, 75%'
    end: '95%, 25%'
    duration: 300
- swipe:
    start: '95%, 75%'
    end: '95%, 25%'
    duration: 300
- swipe:
    start: '95%, 75%'
    end: '95%, 25%'
    duration: 300
- scrollUntilVisible:
    element:
      text: 'Backup status and restore'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Portable data'
    direction: DOWN
    timeout: 30000
- assertVisible: 'Portable data'
- scrollUntilVisible:
    element:
      text: 'This file contains your Super Habits data. Store it somewhere you trust. The exported file is not encrypted — anyone with the file can read its contents.'
    direction: DOWN
    timeout: 10000
- assertVisible: 'This file contains your Super Habits data. Store it somewhere you trust. The exported file is not encrypted — anyone with the file can read its contents.'
- assertVisible: 'Export data'
# Import sits below the fold on this viewport; scroll to it rather than
# asserting off-screen content.
- scrollUntilVisible:
    element: 'Import data'
    direction: DOWN
- assertVisible: 'Import data'
# Empty device: import is offered (not blocked).
- assertNotVisible: 'Import is available only on an empty device'
# Real OS share surface: export opens the Android share sheet.
- scrollUntilVisible:
    element: 'Export data'
    direction: UP
- tapOn: 'Export data'
- extendedWaitUntil:
    visible: 'No apps can perform this action.'
    timeout: 10000
# Dismiss the share sheet without saving (semi-automated share smoke).
- back
# Real OS document picker: import selection surface opens and cancels.
- scrollUntilVisible:
    element: 'Import data'
    direction: DOWN
- tapOn: 'Import data'
- extendedWaitUntil:
    visible: 'Recent'
    timeout: 10000
- assertVisible: 'No items'
- back
- stopApp
