appId: com.dale16.superhabits
tags:
  - native
  - account-v1
  - auth-persistence
---
# Auth persistence across process restart — launch 2 of 3 (runs second,
# right after 01-first's killApp, before 03-protect; no state clearing).
# The SAME anonymous session must be restored: the account
# card stays 'Anonymous / unprotected' and must NOT enter 'Recovery required'
# (which would mean the persisted session was lost and no new anonymous user
# may be created for the bound dataset).
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
# The SAME anonymous session must be restored: the account card stays
# 'Anonymous / unprotected' (pill is styled uppercase; hierarchy text is
# mixed-case) and must NOT enter 'Recovery required' (which would mean the
# persisted session was lost and no new anonymous user may be created for
# the bound dataset).
- scrollUntilVisible:
    element: 'Anonymous / unprotected'
    direction: DOWN
    timeout: 30000
- assertNotVisible: 'Recovery required'
- assertNotVisible: 'Account mismatch'
# Close settings is scrolled off-screen at this point; the kill is the
# state boundary that matters for the restart proof.
- killApp
