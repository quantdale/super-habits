appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - habits
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native daily habit'
- hideKeyboard
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- extendedWaitUntil:
    visible: 'Native daily habit: 0 of 1 today.*'
    timeout: 5000
- tapOn: 'Native daily habit: 0 of 1 today.*'
- assertVisible: 'Native daily habit: 1 of 1 today.*'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
# Cold relaunch loads habits asynchronously; give the query time.
- extendedWaitUntil:
    visible: 'Native daily habit: 1 of 1 today.*'
    timeout: 15000
