appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - habits
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native daily habit'
- hideKeyboard
# The footer starts below the iOS viewport after dismissing the keyboard.
# Bounded gestures inside the modal reveal it without scrolling the page.
- repeat:
    times: 8
    while:
      notVisible: 'Create habit'
    commands:
      - swipe:
          start: '85%, 80%'
          end: '85%, 25%'
          duration: 400
- assertVisible: 'Create habit'
- tapOn: 'Create habit'
# The list keeps its scroll position; bring the new tile into view before
# the unchanged progress assertion.
- scrollUntilVisible:
    element: 'Native daily habit: 0 of 1 today.*'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native daily habit: 0 of 1 today.*'
    timeout: 5000
- tapOn: 'Native daily habit: 0 of 1 today.*'
- assertVisible: 'Native daily habit: 1 of 1 today.*'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
# Cold relaunch loads habits asynchronously; give the query time.
- extendedWaitUntil:
    visible: 'Native daily habit: 1 of 1 today.*'
    timeout: 15000
