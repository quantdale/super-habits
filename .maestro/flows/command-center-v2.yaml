appId: com.dale16.superhabits
tags:
  - native
  - command-v2
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Open command center'
- extendedWaitUntil:
    visible: 'Command center'
    timeout: 10000
- tapOn: 'Create'
- scrollUntilVisible:
    element: 'Command input'
    direction: UP
- extendedWaitUntil:
    visible: 'Command input'
    timeout: 10000
- tapOn: 'Use example: Add a todo to call mom tomorrow'
# The command modal owns the outer ScrollView. Start in its lower blank area;
# swipes beginning in the text field or example list are consumed by children.
- swipe:
    start: '5%, 88%'
    end: '5%, 30%'
    duration: 500
- extendedWaitUntil:
    visible: 'Parse command'
    timeout: 10000
- tapOn: 'Parse command'
# Parsing appends the review card below the input card. Let Maestro wait for
# the async result and scroll the now-overflowing modal to that card.
- scrollUntilVisible:
    element: 'Review before saving'
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible: 'Review before saving'
    timeout: 15000
- assertVisible: 'Nothing has been saved yet.'
- scrollUntilVisible:
    element: 'Ready to save'
    direction: DOWN
- assertVisible: 'Ready to save'
- assertVisible: 'yes'
- scrollUntilVisible:
    element: 'Confirm and save'
    direction: DOWN
- assertVisible: 'Confirm and save'
