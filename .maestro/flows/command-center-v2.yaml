appId: com.dale16.superhabits
tags:
  - native
  - command-v2
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Quick capture'
- extendedWaitUntil:
    visible: 'Add something'
    timeout: 10000
# Let the sheet finish opening and its autofocus pop the keyboard BEFORE
# hideKeyboard: on a slow emulator the keyboard is not up yet when the
# sheet header first appears, and hideKeyboard then acts as BACK and
# dismisses the sheet (Wave 8: sheet gone, 'Describe it' unfindable).
- waitForAnimationToEnd:
    timeout: 8000
- hideKeyboard
# Fail fast with a clear signal if the sheet did not survive keyboard
# dismissal, instead of scrolling the underlying section for 20s.
- extendedWaitUntil:
    visible: 'Add something'
    timeout: 5000
# The sheet autofocuses its input, so the soft keyboard covers the bottom
# actions on short screens. Dismiss it before reaching Describe it.
- scrollUntilVisible:
    element: 'Describe it'
    direction: DOWN
- tapOn: 'Describe it'
- extendedWaitUntil:
    visible: 'Command center'
    timeout: 10000
- tapOn: 'Create'
- scrollUntilVisible:
    element: 'Command input'
    direction: UP
- extendedWaitUntil:
    visible: 'Command input'
    timeout: 10000
- tapOn: 'Use example: Add a todo to call mom tomorrow'
- scrollUntilVisible:
    element: 'Parse command'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Parse command'
    timeout: 10000
- tapOn: 'Parse command'
# Parsing appends the review card below the input card. Let Maestro wait for
# the async result and scroll the now-overflowing modal to that card.
- scrollUntilVisible:
    element: 'Nothing has been saved yet.'
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible: 'Nothing has been saved yet.'
    timeout: 15000
- assertVisible: 'Nothing has been saved yet.'
- scrollUntilVisible:
    element: 'Ready to save'
    direction: DOWN
- assertVisible: 'Ready to save'
- assertVisible: 'yes'
- scrollUntilVisible:
    element: 'Confirm and save'
    direction: DOWN
- assertVisible: 'Confirm and save'