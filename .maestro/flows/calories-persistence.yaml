appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - calories
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    index: 0
- assertVisible: 'Switch between manual entry and a diary grouped by meal.'
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- tapOn: 'Calories entry food'
- inputText: 'Native breakfast'
- tapOn: 'Calories entry protein'
- inputText: '20'
- tapOn: 'Calories entry carbs'
- inputText: '50'
- hideKeyboard
- swipe:
    start: '50%, 66%'
    end: '50%, 40%'
    duration: 350
- tapOn: 'Calories entry fat'
- inputText: '10'
- hideKeyboard
- swipe:
    direction: UP
- tapOn:
    text: 'Add entry'
    below: 'Meal'
    point: '50%,10%'
- scrollUntilVisible:
    element:
      text: 'Diary'
    direction: UP
- tapOn: 'Diary'
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    index: 0
- tapOn: 'Diary'
- assertVisible: 'Native breakfast'

