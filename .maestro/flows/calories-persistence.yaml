appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - calories
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- tapOn: 'Calories entry food'
- inputText: 'Native breakfast'
- tapOn: 'Calories entry protein'
- inputText: '20'
- tapOn: 'Calories entry carbs'
- inputText: '50'
- tapOn: 'Calories entry fat'
- inputText: '10'
- hideKeyboard
- swipe:
    direction: UP
- tapOn:
    text: 'Add entry'
    below: 'Meal'
    point: '50%,10%'
- scrollUntilVisible:
    element:
      text: 'Diary'
    direction: UP
- tapOn: 'Diary'
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- tapOn: 'Diary'
- assertVisible: 'Native breakfast'
