appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - calories
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- assertVisible: 'Switch between manual entry and a diary grouped by meal.'
- scrollUntilVisible:
    element: 'Calories entry food'
    direction: DOWN
- tapOn: 'Calories entry food'
- inputText: 'Native breakfast'
- scrollUntilVisible:
    element: 'Calories entry protein'
    direction: DOWN
- tapOn: 'Calories entry protein'
- inputText: '20'
- scrollUntilVisible:
    element: 'Calories entry carbs'
    direction: DOWN
- tapOn: 'Calories entry carbs'
- inputText: '50'
- scrollUntilVisible:
    element: 'Calories entry fat'
    direction: DOWN
- tapOn: 'Calories entry fat'
- inputText: '10'
- scrollUntilVisible:
    element: 'Meal'
    direction: DOWN
- scrollUntilVisible:
    element: 'Save calorie entry'
    direction: DOWN
    # Center it: the floating tab bar overlaps bottom-edge content, so
    # a11y "visible" can still sit under the tab bar and the tap navigates.
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Save calorie entry'
# Let the post-save rebuild settle: scrolling while the form/list is still
# re-rendering starves the matcher and times out even though the row renders
# (same class as the diary-transition note below).
- waitForAnimationToEnd:
    timeout: 8000
# The post-save rebuild leaves the saved section below the fold. In this
# state Maestro's center-anchored scroll swipes start in the upper half and
# do not move the list (reproduced: two center swipes changed nothing while a
# swipe starting at 80% height revealed the section immediately). Pre-scroll
# from a low anchor, then finish with the scoped scroll.
- swipe:
    start: '50%, 80%'
    end: '50%, 30%'
    duration: 400
- scrollUntilVisible:
    element: 'Logged today'
    direction: DOWN
- swipe:
    direction: DOWN
- scrollUntilVisible:
    element: 'Diary view'
    direction: UP
# Settle before tapping: a stale-coordinate tap misses the Diary switch,
# leaving the Form visible whose food input still reads 'Native breakfast'
# — the later text assert then false-passes on the input and the relaunch
# finds a genuinely empty diary (Wave 8 trace proof).
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Diary view'
# Let the diary transition + chart settle: scrolling while the list is still
# mounting starves the matcher and times out even though the entry renders.
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element: 'Native breakfast'
    direction: DOWN
# Polled (not single-shot) with the same 15s budget as the post-restart
# check: Wave 10 shows the scroller finding the row while a short poll
# misses it during the diary list rebuild. Same assertion, no weakening.
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 15000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
# W8-4 probe (permanent): viewMode persisted as diary, so Calories opens in
# diary; switch explicitly to Form first and prove the row survived restart
# through the FORM read path before exercising the diary layer. The
# 'Logged today' header renders ONLY when entries.length > 0
# (CaloriesFormView, code-guaranteed), so it is the sound signal — plain
# entry text would also match the recent/frequent chips. Header-shows +
# diary-empty localizes a diary-layer defect; both-empty implicates the
# shared entries state (a root-pulled DB dump already rules out data
# loss). Scroll first: the section sits below the fold.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Form view'
- swipe:
    start: '50%, 80%'
    end: '50%, 30%'
    duration: 400
- scrollUntilVisible:
    element: 'Logged today'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Logged today'
    timeout: 15000
# Back to the top: the Form/Diary toggle scrolled off-screen with the
# probe scroll, and a blind tap misses it.
- scrollUntilVisible:
    element: 'Diary view'
    direction: UP
- tapOn: 'Diary view'
- waitForAnimationToEnd:
    timeout: 8000
# The saved entry chip renders mid-list in the current diary layout, so the
# old scroll-UP assumption (chip pinned under the tab rail) instead pushes it
# off-screen while the diary is still rebuilding: the step-048 artifact shows
# "Native breakfast" fully visible at y1409 while the UP scroll reported it
# missing. Poll for the same visibility with no directional scroll.
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 20000
