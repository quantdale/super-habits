appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - calories
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    index: 0
- assertVisible: 'Switch between manual entry and a diary grouped by meal.'
- swipe:
    direction: UP
- scrollUntilVisible:
    element: 'Calories entry food'
    direction: DOWN
- tapOn: 'Calories entry food'
- inputText: 'Native breakfast'
- scrollUntilVisible:
    element: 'Calories entry protein'
    direction: DOWN
- tapOn: 'Calories entry protein'
- inputText: '20'
- scrollUntilVisible:
    element: 'Calories entry carbs'
    direction: DOWN
- tapOn: 'Calories entry carbs'
- inputText: '50'
- scrollUntilVisible:
    element: 'Calories entry fat'
    direction: DOWN
- tapOn: 'Calories entry fat'
- inputText: '10'
- scrollUntilVisible:
    element: 'Meal'
    direction: DOWN
- scrollUntilVisible:
    element: 'Save calorie entry'
    direction: DOWN
- tapOn: 'Save calorie entry'
- scrollUntilVisible:
    element: 'Logged today'
    direction: DOWN
- swipe:
    direction: DOWN
- scrollUntilVisible:
    element: 'Diary view'
    direction: UP
- tapOn: 'Diary view'
- scrollUntilVisible:
    element: 'Native breakfast'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    index: 0
- tapOn: 'Diary view'
- swipe:
    direction: UP
- scrollUntilVisible:
    element: 'Native breakfast'
    direction: DOWN
    visibilityPercentage: 60
- extendedWaitUntil:
    visible: 'Native breakfast'
    timeout: 15000
