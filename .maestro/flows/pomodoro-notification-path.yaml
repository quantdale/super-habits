appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - pomodoro
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- swipe:
    direction: LEFT
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: home
- launchApp:
    stopApp: false
- assertVisible: 'Pause'
