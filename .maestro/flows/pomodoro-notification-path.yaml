appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - notifications
  - pomodoro
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Focus'
    childOf:
      text: 'Section tabs'
- tapOn: 'Start focus'
- assertVisible: 'Pause'
- pressKey: home
- launchApp:
    stopApp: false
- assertVisible: 'Pause'
