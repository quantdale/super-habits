appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - habits
  - habit-v2
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native M-W-F habit'
- hideKeyboard
- tapOn: 'Custom'
- tapOn: 'Tuesday scheduled'
- tapOn: 'Thursday scheduled'
- tapOn: 'Saturday scheduled'
- tapOn: 'Sunday scheduled'
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# The new habit lands at the TOP of the Anytime group, but the screen is still
# scrolled to the bottom-edge add tile, so a DOWN scroll can never reach it.
# Return to the top with explicit side-margin swipes, then finish with the
# scoped scroll (handles a long Anytime group too).
- swipe:
    start: '5%, 30%'
    end: '5%, 75%'
    duration: 300
- swipe:
    start: '5%, 30%'
    end: '5%, 75%'
    duration: 300
- scrollUntilVisible:
    element: 'Native M-W-F habit'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native M-W-F habit'
    timeout: 5000
- assertVisible: 'Mon / Wed / Fri'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- extendedWaitUntil:
    visible: 'Native M-W-F habit'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Mon / Wed / Fri'
    timeout: 5000
