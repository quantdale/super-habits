appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - habits
  - habit-v2
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
# Index 1 targets the input: index 0 is the visible label (tapping it focuses nothing and drops typed text).
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native M-W-F habit'
- hideKeyboard
- tapOn: 'Custom'
- tapOn: 'Tuesday scheduled'
- tapOn: 'Thursday scheduled'
- tapOn: 'Saturday scheduled'
- tapOn: 'Sunday scheduled'
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
- scrollUntilVisible:
    element: 'Native M-W-F habit'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native M-W-F habit'
    timeout: 5000
- assertVisible: 'Mon / Wed / Fri'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- extendedWaitUntil:
    visible: 'Native M-W-F habit'
    timeout: 15000
- extendedWaitUntil:
    visible: 'Mon / Wed / Fri'
    timeout: 5000
