appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - notifications
  - habits
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Add anytime habit'
    direction: DOWN
- tapOn: 'Add anytime habit'
- tapOn: 'Habit name'
- inputText: 'Native disable reminder'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# Return toward the top so the fresh Anytime-group row enters the viewport.
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 20%'
    end: '50%, 92%'
    duration: 400
- swipe:
    start: '50%, 66%'
    end: '50%, 28%'
    duration: 350
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 5000
- scrollUntilVisible:
    element: 'Reminder 18:00'
    direction: DOWN
- assertVisible: 'Reminder 18:00'
- scrollUntilVisible:
    element: 'Enter habit edit mode'
    direction: UP
- tapOn: 'Enter habit edit mode'
- scrollUntilVisible:
    element: 'Edit Native disable reminder'
    direction: DOWN
- tapOn: 'Edit Native disable reminder'
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Save changes'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Save changes'
    timeout: 20000
- tapOn: 'Save changes'
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 5000
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- assertNotVisible: 'Reminder 18:00'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    index: 0
- scrollUntilVisible:
    element: 'Native disable reminder'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 15000
- swipe:
    start: '50%, 70%'
    end: '50%, 30%'
    duration: 350
- assertNotVisible: 'Reminder 18:00'
