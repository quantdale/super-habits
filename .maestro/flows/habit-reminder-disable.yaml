appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - notifications
  - habits
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Add habit'
    direction: DOWN
    # Center the bottom-edge add tile: without this the tile settles under the
    # emulator taskbar and the tap lands on the launcher home button.
    centerElement: true
- tapOn: 'Add habit'
# Index 1 targets the input; index 0 is the label and drops typed text.
- tapOn:
    text: 'Habit name'
    index: 1
- inputText: 'Native disable reminder'
- hideKeyboard
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Create habit'
    direction: DOWN
- tapOn: 'Create habit'
# The list keeps its scroll position; bring the new tile into view before the
# unchanged assertion.
- scrollUntilVisible:
    element: 'Native disable reminder'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 5000
- scrollUntilVisible:
    element: 'Reminder 18:00'
    direction: DOWN
- assertVisible: 'Reminder 18:00'
- scrollUntilVisible:
    element: 'Open Native disable reminder details'
    direction: UP
- tapOn: 'Open Native disable reminder details'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Edit habit'
    direction: DOWN
- tapOn: 'Edit habit'
- scrollUntilVisible:
    element: 'Enable habit reminder'
    direction: DOWN
- tapOn: 'Enable habit reminder'
- scrollUntilVisible:
    element: 'Save changes'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Save changes'
    timeout: 20000
- tapOn: 'Save changes'
- scrollUntilVisible:
    element: 'Native disable reminder'
    direction: UP
    centerElement: true
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 5000
- assertNotVisible: 'Reminder 18:00'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    # Scope to the section switcher (unscoped index-0 can hit inert content).
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Native disable reminder'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Native disable reminder'
    timeout: 15000
- assertNotVisible: 'Reminder 18:00'
