appId: com.dale16.superhabits
tags:
  - native
  - account-v1
  - auth-persistence
---
# Auth persistence across process restart — FIRST launch on a fresh install.
# The app bootstraps an anonymous Supabase session and provisionally binds the
# empty dataset. The test harness extracts the durable owner UID from the app's
# SQLite (app_meta.account.owner_user_id) and the Auth session id from
# AsyncStorage between this flow and auth-session-restart.yaml, then asserts
# both are unchanged after the force-stop/relaunch.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
# Anonymous bootstrap + provisional owner binding complete asynchronously.
# The pill is styled uppercase but its text is 'Anonymous / unprotected';
# Maestro matches hierarchy text, so assert the raw string.
- scrollUntilVisible:
    element: 'Anonymous / unprotected'
    direction: DOWN
    timeout: 30000
# Close settings is scrolled off-screen at this point; the kill is the
# state boundary that matters for the restart proof.
- killApp
