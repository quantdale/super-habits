appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- tapOn: 'Routine name'
- inputText: 'Native strength routine'
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- tapOn: 'Description'
- inputText: 'Native routine'
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- swipe:
    start: '50%, 66%'
    end: '50%, 26%'
    duration: 350
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native strength routine routine'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Open Native strength routine routine'
    timeout: 5000
- tapOn: 'Open Native strength routine routine'
- tapOn: 'Exercise name'
- inputText: 'Native rows'
- tapOn: 'Add'
- assertVisible: 'Native rows'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Native strength routine'
    direction: DOWN
- assertVisible: 'Native strength routine'

