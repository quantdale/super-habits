appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'New routine name'
    direction: DOWN
- tapOn: 'New routine name'
- inputText: 'Native strength routine'
# Blur before the next field so no scroll/focus animation can shift the layout
# between Maestro's hierarchy read and the tap.
- pressKey: enter
- tapOn: 'New routine description'
- inputText: 'Native routine'
- pressKey: enter
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
    # Center it: the floating tab bar overlaps bottom-edge content, so
    # a11y "visible" can still sit under the tab bar and the tap navigates.
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native strength routine routine'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: 'Open Native strength routine routine'
    timeout: 5000
- tapOn: 'Open Native strength routine routine'
- tapOn: 'Exercise name'
- inputText: 'Native rows'
- scrollUntilVisible:
    element: 'Add'
    direction: DOWN
    centerElement: true
- tapOn: 'Add'
- scrollUntilVisible:
    element: 'Configure Native rows exercise'
    direction: UP
- assertVisible: 'Configure Native rows exercise'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
- scrollUntilVisible:
    element: 'Native strength routine'
    direction: DOWN
- assertVisible: 'Native strength routine'
