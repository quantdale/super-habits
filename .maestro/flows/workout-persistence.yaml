appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Routine name'
    direction: DOWN
- tapOn: 'New routine name'
- inputText: 'Native strength routine'
- scrollUntilVisible:
    element: 'Description'
    direction: DOWN
- tapOn: 'New routine description'
- inputText: 'Native routine'
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native strength routine routine'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Open Native strength routine routine'
    timeout: 5000
- tapOn: 'Open Native strength routine routine'
- tapOn: 'Exercise name'
- inputText: 'Native rows'
- scrollUntilVisible:
    element: 'Add'
    direction: DOWN
- tapOn: 'Add'
- scrollUntilVisible:
    element: 'Configure Native rows exercise'
    direction: UP
- assertVisible: 'Configure Native rows exercise'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Native strength routine'
    direction: DOWN
- assertVisible: 'Native strength routine'
