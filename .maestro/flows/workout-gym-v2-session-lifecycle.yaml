appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - workout
  - gym-v2
---
# Gym V2 durable active-session draft: entered measurements remain available
# after a force-stop/relaunch and the resumed session writes typed history.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'New routine name'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'New routine name'
- inputText: 'Native Gym V2 resume routine'
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native Gym V2 resume routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 resume routine routine'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Exercise library search'
- inputText: 'zzzz-native-resume'
- pressKey: enter
# Explicit proof the filter applied: with zero matches the list collapses
# to the empty state and the create form sits near the top.
- extendedWaitUntil:
    visible: 'No matching exercises'
    timeout: 10000
- scrollUntilVisible:
    element: 'Custom exercise name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Custom exercise name'
- inputText: 'Native resume press'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Custom exercise primary area'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Custom exercise primary area'
- inputText: 'chest'
- pressKey: enter
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn: 'Custom exercise equipment'
- inputText: 'barbell'
- pressKey: enter
- scrollUntilVisible:
    element: 'Custom exercise aliases'
    direction: DOWN
- tapOn: 'Custom exercise aliases'
- inputText: 'incline press'
- pressKey: enter
- scrollUntilVisible:
    element: 'Custom exercise instructions'
    direction: DOWN
- tapOn: 'Custom exercise instructions'
- inputText: 'Brace and press with a controlled descent'
- pressKey: enter
- scrollUntilVisible:
    element: 'Create and add'
    direction: DOWN
- tapOn: 'Create and add'
- scrollUntilVisible:
    element: 'Configure Native resume press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native resume press exercise'
    timeout: 10000
- tapOn: 'Start workout'
- extendedWaitUntil:
    visible: 'Start'
    timeout: 10000
- tapOn: 'Start'
- extendedWaitUntil:
    visible: 'Complete set'
    timeout: 5000
- tapOn: 'Weight'
- inputText: '42'
- hideKeyboard
- tapOn: 'Reps input'
- inputText: '6'
- waitForAnimationToEnd:
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- extendedWaitUntil:
    visible: 'Workout in progress'
    timeout: 15000
- tapOn: 'Resume workout'
- extendedWaitUntil:
    visible: 'Complete set now'
    timeout: 10000
- assertVisible: '42'
- assertVisible: '6'
- tapOn: 'Complete set now'
- extendedWaitUntil:
    visible: 'Workout complete!'
    timeout: 5000
- tapOn: 'Save and finish'
- extendedWaitUntil:
    visible: 'Workout saved'
    timeout: 15000
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
    visibilityPercentage: 50
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
- assertVisible: 'Native Gym V2 resume routine'
- scrollUntilVisible:
    element: 'Progress'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: 'Progress'
