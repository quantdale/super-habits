appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - workout
  - gym-v2
---
# Gym V2 durable active-session draft: entered measurements remain available
# after a force-stop/relaunch and the resumed session writes typed history.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
- repeat:
    times: 8
    while:
      notVisible: 'Routine name'
    commands:
      - swipe:
          start: '5%, 80%'
          end: '5%, 25%'
          duration: 400
- assertVisible: 'Routine name'
# The field is visible after the bounded search; an extra swipe hides it.
- tapOn: 'New routine name'
- inputText: 'Native Gym V2 resume routine'
# Blur the focused field before revealing the bottom-edge submit control.
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Add routine'
# The new routine is prepended to the routines list, which sits ABOVE the
# 'New routine' form, so the row is reached by scrolling UP. No centerElement:
# Maestro 2.2.0's centering with direction UP does not converge on this
# target (run 38793221651 — the row was found fully visible yet the centering
# swipes overshot it until the 20s budget expired in hierarchy fetches).
- scrollUntilVisible:
    element: 'Open Native Gym V2 resume routine routine'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Open Native Gym V2 resume routine routine'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'Choose from exercise library'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Exercise library search'
- inputText: 'zzzz-native-resume'
- pressKey: enter
# Explicit proof the filter applied: with zero matches the list collapses
# to the empty state and the create form sits near the top.
- scrollUntilVisible:
    element: 'No matching exercises'
    direction: DOWN
- extendedWaitUntil:
    visible: 'No matching exercises'
    timeout: 10000
- scrollUntilVisible:
    element: 'Custom exercise name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Custom exercise name'
- inputText: 'Native resume press'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Custom exercise primary area'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Custom exercise primary area'
- inputText: 'chest'
- pressKey: enter
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn: 'Custom exercise equipment'
- inputText: 'barbell'
- pressKey: enter
- scrollUntilVisible:
    element: 'Custom exercise aliases'
    direction: DOWN
- tapOn: 'Custom exercise aliases'
- inputText: 'incline press'
# Enter on the alias input dismisses the iOS picker. Scroll within the panel
# above the keyboard instead and retain the custom metadata assertions.
- repeat:
    times: 8
    while:
      notVisible: 'Custom exercise instructions'
    commands:
      - swipe:
          start: '85%, 55%'
          end: '85%, 20%'
          duration: 400
- assertVisible: 'Custom exercise instructions'
- tapOn: 'Custom exercise instructions'
- inputText: 'Brace and press with a controlled descent'
# Blur the final text field so the submit tap is not competing with the iOS keyboard.
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    times: 8
    while:
      notVisible: 'Create and add'
    commands:
      - swipe:
          start: '85%, 55%'
          end: '85%, 20%'
          duration: 400
# The bounded repeat above already leaves this fully visible on iOS; an extra
# scrollUntilVisible fails when it is already on screen.
- assertVisible: 'Create and add'
- tapOn: 'Create and add'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gym-v2-session-custom-exercise-submit
- scrollUntilVisible:
    element: 'Configure Native resume press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native resume press exercise'
    timeout: 10000
- tapOn: 'Start workout'
- extendedWaitUntil:
    visible: 'Start'
    timeout: 10000
- tapOn: 'Start'
# W9 numbers each set's control: the accessible name is `Complete set <n>`,
# never a bare `Complete set`.
- extendedWaitUntil:
    visible: 'Complete set 1'
    timeout: 5000
- tapOn:
    text: 'Weight'
    index: 1
- inputText: '42'
- assertVisible: '42'
# Enter-to-blur, not hideKeyboard: run 36423379932 failed at this exact step
# with "Couldn't hide the keyboard." for this session's custom numeric inputs.
# Weight-survival proof is unchanged: '42' here, and '42' + '6' again after
# killApp/launchApp at 'Resume workout'. Evidence:
# openspec/changes/final-certification-closure/ios-flow-classification.md
- pressKey: enter
- tapOn:
    text: 'Reps'
    index: 1
- inputText: '6'
- waitForAnimationToEnd:
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
# The landing's active-session panel is titled 'Session in progress' on the
# current source ('Workout in progress' was the pre-W9.5 wording).
- extendedWaitUntil:
    visible: 'Session in progress'
    timeout: 15000
# The resume button's accessible name carries the routine ('Resume workout ·
# Native Gym V2 resume routine' — run 38838647812), so the selector must be a
# partial-match wrapper: a full-match 'Resume workout' misses it (the same
# class as the todo-persistence 'Edit task: <title>' fix).
- tapOn: '.*Resume workout.*'
- extendedWaitUntil:
    visible: 'Complete set 1'
    timeout: 10000
- assertVisible: '42'
- assertVisible: '6'
- tapOn: 'Complete set 1'
- extendedWaitUntil:
    visible: 'Workout complete!'
    timeout: 5000
- tapOn: 'Save and finish'
- extendedWaitUntil:
    visible: 'Workout saved'
    timeout: 15000
- tapOn: 'Done'
# W9 collapses History & insights by default, and 'Recent sessions' renders
# inside it, so the disclosure must be opened before the session list exists.
# The history disclosure parks at the bottom edge (run 38855979274:
# [16,748][386,808] — the bounds-center (201,778) lands on the floating tab
# bar's top edge and the tap never opens it). It also cannot be centered:
# the section is at the content's end, so run 38869382876 showed the
# centering stall at [16,581] (try 1→2 unchanged) and time out. Pull it
# clear with one controlled slow drag instead (no fling), then tap.
- scrollUntilVisible:
    element: 'History and insights'
    direction: DOWN
    visibilityPercentage: 50
- swipe:
    start: '50%, 78%'
    end: '50%, 63%'
    duration: 800
- tapOn: 'History and insights'
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
    visibilityPercentage: 50
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
# Same tab-bar-edge pull as the pre-restart block (runs 38855979274 /
# 38869382876): no centerElement — the section sits at the content's end and
# centering can never converge there.
- scrollUntilVisible:
    element: 'History and insights'
    direction: DOWN
    visibilityPercentage: 50
- swipe:
    start: '50%, 78%'
    end: '50%, 63%'
    duration: 800
- tapOn: 'History and insights'
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
- assertVisible: 'Native Gym V2 resume routine'
- scrollUntilVisible:
    element: 'Progress'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: 'Progress'
