appId: com.dale16.superhabits
tags:
  - native
  - lifecycle
  - workout
  - gym-v2
---
# Gym V2 durable active-session draft: entered measurements remain available
# after a force-stop/relaunch and the resumed session writes typed history.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Routine name'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Routine name'
- inputText: 'Native Gym V2 resume routine'
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native Gym V2 resume routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 resume routine routine'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
- tapOn: 'Search exercises'
- inputText: 'zzzz-native-resume'
- hideKeyboard
- scrollUntilVisible:
    element: 'Name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Name'
- inputText: 'Native resume press'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: '50%, 80%'
    end: '50%, 40%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Primary body area'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: 'Primary body area'
- inputText: 'chest'
- hideKeyboard
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn:
    text: 'Equipment'
    index: 1
- inputText: 'barbell'
- hideKeyboard
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn: 'Search aliases (comma separated)'
- inputText: 'incline press'
- hideKeyboard
- scrollUntilVisible:
    element: 'Instructions (optional)'
    direction: DOWN
- tapOn: 'Instructions (optional)'
- inputText: 'Brace and press with a controlled descent'
- hideKeyboard
- scrollUntilVisible:
    element: 'Create and add'
    direction: DOWN
- tapOn: 'Create and add'
- scrollUntilVisible:
    element: 'Configure Native resume press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native resume press exercise'
    timeout: 10000
- tapOn: 'Start workout'
- extendedWaitUntil:
    visible: 'Start'
    timeout: 10000
- tapOn: 'Start'
- extendedWaitUntil:
    visible: 'Complete set'
    timeout: 5000
- tapOn: 'Weight'
- inputText: '42'
- hideKeyboard
- tapOn: 'Reps input'
- inputText: '6'
- waitForAnimationToEnd:
    timeout: 5000
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- extendedWaitUntil:
    visible: 'Workout in progress'
    timeout: 15000
- tapOn: 'Resume workout'
- extendedWaitUntil:
    visible: 'Complete set now'
    timeout: 10000
- assertVisible: '42'
- assertVisible: '6'
- tapOn: 'Complete set now'
- extendedWaitUntil:
    visible: 'Workout complete!'
    timeout: 5000
- tapOn: 'Save and finish'
- extendedWaitUntil:
    visible: 'Workout saved'
    timeout: 15000
- tapOn: 'Done'
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
    visibilityPercentage: 50
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- scrollUntilVisible:
    element: 'Recent sessions'
    direction: DOWN
- assertVisible: 'Native Gym V2 resume routine'
- scrollUntilVisible:
    element: 'Progress'
    direction: DOWN
- assertVisible: 'Progress'
