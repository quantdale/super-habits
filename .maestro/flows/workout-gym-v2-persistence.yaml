appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
  - gym-v2
---
# Gym V2 native persistence: a custom catalog-backed exercise, typed
# prescription fields, and weekly planning survive a process restart.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
- swipe:
    direction: UP
- repeat:
    times: 8
    while:
      notVisible: 'Routine name'
    commands:
      - swipe:
          start: '5%, 80%'
          end: '5%, 25%'
          duration: 400
- assertVisible: 'Routine name'
# Maestro treats a field as visible when its bounds intersect the screen, even
# when those bounds sit under the floating tab bar (failure at source 52a10d0:
# New routine name bounds y=2199 on a 2400px display, tap center landed on the
# centered capture button / nav zone, then the following center-swipe opened
# the Plan sheet and Add routine was gone). Lift the field with an edge swipe
# — not scrollUntilVisible, whose gesture starts at screen center — then prove
# the characters landed in the routine field before searching for Add routine.
- swipe:
    start: '90%, 78%'
    end: '90%, 52%'
    duration: 400
- tapOn: 'New routine name'
- inputText: 'Native Gym V2 typed routine'
- pressKey: enter
- extendedWaitUntil:
    visible: 'Native Gym V2 typed routine'
    timeout: 8000
- assertNotVisible: 'Save Plan'
# Reveal Add routine from the screen edge so the swipe cannot start on the
# capture button or a mid-screen planning control. The short follow-up swipe
# always runs: the repeat stops as soon as the button intersects the screen,
# which on this form is the bottom edge under the tab bar. 16% of the height
# lifts that edge without carrying a mid-screen button off the top.
- repeat:
    times: 4
    while:
      notVisible: 'Add routine'
    commands:
      - swipe:
          start: '90%, 72%'
          end: '90%, 42%'
          duration: 400
- swipe:
    start: '90%, 68%'
    end: '90%, 52%'
    duration: 300
- extendedWaitUntil:
    visible: 'Add routine'
    timeout: 8000
- assertNotVisible: 'Save Plan'
# Settle before tapping: a tap aimed from a still-settling hierarchy can land
# on stale coordinates (documented in native-smoke).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Add routine'
# The new routine is prepended to the routines list, which sits ABOVE the
# 'New routine' form, so the row is reached by scrolling UP.
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: UP
    visibilityPercentage: 50
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'Open Native Gym V2 typed routine routine'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'Choose from exercise library'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
# Let the picker fade animation settle: tapping the search field mid-fade
# misses focus, the query stays empty, and the full catalog renders (a
# ~7000px scroll the form steps below can never complete). pressKey enter
# (blur) is used instead of hideKeyboard inside the picker: on an emulator
# without a soft keyboard, hideKeyboard sends BACK and dismisses the modal.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Exercise library search'
- inputText: 'zzzz-native-custom'
- pressKey: enter
# Explicit proof the filter applied: with zero matches the list collapses
# to the empty state (its copy can sit just below the fold on the emulator).
- scrollUntilVisible:
    element: 'No matching exercises'
    direction: DOWN
- extendedWaitUntil:
    visible: 'No matching exercises'
    timeout: 10000
- scrollUntilVisible:
    element: 'Custom exercise name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Custom exercise name'
- inputText: 'Native custom press'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Custom exercise primary area'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Custom exercise primary area'
- inputText: 'chest'
- pressKey: enter
# Scroll past equipment to the aliases label — the lifecycle flow's proven
# stop. Stopping at equipment leaves instructions too low for the bounded
# swipes to reveal it (exact-SHA run: seq47 swipes exhausted, seq56 assert).
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn: 'Custom exercise equipment'
- inputText: 'barbell'
- pressKey: enter
# Reveal the aliases field with the scoped scroll the lifecycle flow uses
# (the 85%-edge repeat left instructions below the swipe budget), then assert.
- scrollUntilVisible:
    element: 'Custom exercise aliases'
    direction: DOWN
- assertVisible: 'Custom exercise aliases'
- tapOn: 'Custom exercise aliases'
- inputText: 'incline press'
# Enter on the alias input dismisses the iOS picker. Scroll within the panel
# above the keyboard instead and retain the custom metadata assertions.
- repeat:
    times: 8
    while:
      notVisible: 'Custom exercise instructions'
    commands:
      - swipe:
          start: '85%, 55%'
          end: '85%, 20%'
          duration: 400
- assertVisible: 'Custom exercise instructions'
- tapOn: 'Custom exercise instructions'
- inputText: 'Brace and press with a controlled descent'
# Blur the final text field so the submit tap is not competing
# with the iOS keyboard.
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- repeat:
    times: 8
    while:
      notVisible: 'Create and add'
    commands:
      - swipe:
          start: '85%, 55%'
          end: '85%, 20%'
          duration: 400
# The bounded repeat above already leaves this fully visible on iOS; an extra
# scrollUntilVisible fails when it is already on screen.
- assertVisible: 'Create and add'
- tapOn: 'Create and add'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: gym-v2-custom-exercise-submit
- scrollUntilVisible:
    element: 'Configure Native custom press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native custom press exercise'
    timeout: 10000
- assertVisible: 'Strength'
- scrollUntilVisible:
    element: 'Linear'
    direction: DOWN
- tapOn: 'Linear'
- waitForAnimationToEnd:
    timeout: 3000
# UNPROVEN REPLACEMENT, pending task 3.3. Run 36423379932 (seq64-seq72)
# reported all eight swipes COMPLETED and still failed: the failure hierarchy
# held none of the exercise-card nodes, only the Workout landing cards. So the
# old construct left the routine detail, but the artifact does not show which
# gesture did it, nor that this scroll stays on the card. centerElement is
# omitted on purpose: the comment this block replaced recorded that a centered
# scroll already escaped to the Workout screen, and Maestro's default swipe is
# still centred. Treat this as a hypothesis for the next exact-SHA run.
# Evidence: openspec/changes/final-certification-closure/
# ios-flow-classification.md
- scrollUntilVisible:
    element: 'Native custom press progression increment'
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- assertVisible: 'Native custom press progression increment'
- tapOn: 'Native custom press progression increment'
- inputText: '2.5'
- pressKey: enter
- scrollUntilVisible:
    element: 'Native custom press minimum reps'
    direction: DOWN
- tapOn: 'Native custom press minimum reps'
- inputText: '5'
- pressKey: enter
- scrollUntilVisible:
    element: 'Native custom press maximum reps'
    direction: DOWN
- tapOn: 'Native custom press maximum reps'
- inputText: '8'
- pressKey: enter
- scrollUntilVisible:
    element: 'Target reps min'
    direction: DOWN
- tapOn: 'Target reps min'
- inputText: '5'
- pressKey: enter
- scrollUntilVisible:
    element: 'Target reps max'
    direction: DOWN
- tapOn: 'Target reps max'
- inputText: '8'
- pressKey: enter
# The reps inputs sit under Maestro's center-swipe origin, so
# scrollUntilVisible's
# own swipes are consumed by the focused EditText and the list never moves.
# Cross the remaining form with an explicit side-margin swipe (same class as the
# auth-session/backup-v2 flows) before the scoped scroll.
- swipe:
    start: '85%, 72%'
    end: '85%, 25%'
    duration: 300
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: 'Target load'
- inputText: '40'
- pressKey: enter
- assertVisible: 'Target load'
- pressKey: BACK
# The weekly-plan section label is 'This week' (the uppercase rendering is a
# CSS transform, not the text node), and Maestro matches the full text.
- scrollUntilVisible:
    element: 'This week'
    direction: UP
    visibilityPercentage: 50
- assertVisible: 'This week'
# Assigning a routine to a weekday goes through the day's assign sheet: the
# cell opens it and the routine is one of its chips. (The previous flow tapped
# a combined 'Monday <routine>' label that no longer exists.)
- tapOn: 'Monday assign routine'
- extendedWaitUntil:
    visible: 'Assign Monday in your recurring weekly plan.'
    timeout: 10000
- tapOn: 'Native Gym V2 typed routine'
# Assigning closes the day sheet itself, so there is no Close to tap here.
- assertVisible: 'Monday: Native Gym V2 typed routine'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    # Scope to the section switcher: the Overview stat strip also exposes
    # "Workout" and an unscoped index-0 match can land on inert content.
    childOf:
      text: 'Section tabs'
- assertVisible: 'Monday: Native Gym V2 typed routine'
# W9 renamed the routines section to 'Quick start'; 'Your routines' no longer
# exists on the landing.
- scrollUntilVisible:
    element: 'QUICK START'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: 'QUICK START'
# The new routine is prepended to the routines list, which sits ABOVE the
# 'New routine' form, so the row is reached by scrolling UP.
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: UP
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 typed routine routine'
- tapOn: 'Configure Native custom press exercise'
- swipe:
    start: '85%, 72%'
    end: '85%, 25%'
    duration: 300
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
- assertVisible: 'Target load'
- assertVisible: '40'
- assertVisible: '5'
- assertVisible: '8'
