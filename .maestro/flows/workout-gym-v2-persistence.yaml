appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
  - gym-v2
---
# Gym V2 native persistence: a custom catalog-backed exercise, typed
# prescription fields, and weekly planning survive a process restart.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- swipe:
    direction: UP
- scrollUntilVisible:
    element: 'Routine name'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'New routine name'
- inputText: 'Native Gym V2 typed routine'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 typed routine routine'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
# Let the picker fade animation settle: tapping the search field mid-fade
# misses focus, the query stays empty, and the full catalog renders (a
# ~7000px scroll the form steps below can never complete). pressKey enter
# (blur) is used instead of hideKeyboard inside the picker: on an emulator
# without a soft keyboard, hideKeyboard sends BACK and dismisses the modal.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: 'Exercise library search'
- inputText: 'zzzz-native-custom'
- pressKey: enter
# Explicit proof the filter applied: with zero matches the list collapses
# to the empty state and the create form sits near the top.
- extendedWaitUntil:
    visible: 'No matching exercises'
    timeout: 10000
- scrollUntilVisible:
    element: 'Custom exercise name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Custom exercise name'
- inputText: 'Native custom press'
- pressKey: enter
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Custom exercise primary area'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Custom exercise primary area'
- inputText: 'chest'
- pressKey: enter
- scrollUntilVisible:
    element: 'Custom exercise equipment'
    direction: DOWN
- tapOn: 'Custom exercise equipment'
- inputText: 'barbell'
- pressKey: enter
- tapOn: 'Custom exercise aliases'
- inputText: 'incline press'
- pressKey: enter
- scrollUntilVisible:
    element: 'Custom exercise instructions'
    direction: DOWN
- tapOn: 'Custom exercise instructions'
- inputText: 'Brace and press with a controlled descent'
- pressKey: enter
- scrollUntilVisible:
    element: 'Create and add'
    direction: DOWN
- tapOn: 'Create and add'
- scrollUntilVisible:
    element: 'Configure Native custom press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native custom press exercise'
    timeout: 10000
- assertVisible: 'Strength'
- tapOn: 'Linear'
- scrollUntilVisible:
    element: 'Native custom press progression increment'
    direction: DOWN
- tapOn: 'Native custom press progression increment'
- inputText: '2.5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Native custom press minimum reps'
    direction: DOWN
- tapOn: 'Native custom press minimum reps'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Native custom press maximum reps'
    direction: DOWN
- tapOn: 'Native custom press maximum reps'
- inputText: '8'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target reps min'
    direction: DOWN
- tapOn: 'Target reps min'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target reps max'
    direction: DOWN
- tapOn: 'Target reps max'
- inputText: '8'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: 'Target load'
- inputText: '40'
- hideKeyboard
- assertVisible: 'Target load'
- pressKey: BACK
- scrollUntilVisible:
    element: 'Week'
    direction: UP
    visibilityPercentage: 50
- assertVisible: 'Week'
- tapOn: 'Monday Native Gym V2 typed routine'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- assertVisible: 'Monday Native Gym V2 typed routine'
- scrollUntilVisible:
    element: 'Your routines'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: 'Your routines'
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 typed routine routine'
- tapOn: 'Configure Native custom press exercise'
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
- assertVisible: 'Target load'
- assertVisible: '40'
- assertVisible: '5'
- assertVisible: '8'
