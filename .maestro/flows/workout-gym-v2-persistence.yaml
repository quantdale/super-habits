appId: com.dale16.superhabits
tags:
  - native
  - persistence
  - workout
  - gym-v2
---
# Gym V2 native persistence: a custom catalog-backed exercise, typed
# prescription fields, and weekly planning survive a process restart.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- swipe:
    direction: UP
- scrollUntilVisible:
    element: 'Routine name'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Routine name'
- inputText: 'Native Gym V2 typed routine'
- hideKeyboard
- scrollUntilVisible:
    element: 'Add routine'
    direction: DOWN
- tapOn: 'Add routine'
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 typed routine routine'
- tapOn: 'Choose from exercise library'
- extendedWaitUntil:
    visible: 'Exercise library'
    timeout: 5000
- tapOn: 'Search exercises'
- inputText: 'zzzz-native-custom'
- hideKeyboard
- scrollUntilVisible:
    element: 'Name'
    direction: DOWN
    visibilityPercentage: 100
- tapOn: 'Name'
- inputText: 'Native custom press'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- swipe:
    start: '50%, 80%'
    end: '50%, 40%'
    duration: 600
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: 'Primary body area'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: 'Primary body area'
- inputText: 'chest'
- hideKeyboard
- scrollUntilVisible:
    element: 'Search aliases (comma separated)'
    direction: DOWN
- tapOn:
    text: 'Equipment'
    index: 1
- inputText: 'barbell'
- hideKeyboard
- tapOn: 'Search aliases (comma separated)'
- inputText: 'incline press'
- hideKeyboard
- scrollUntilVisible:
    element: 'Instructions (optional)'
    direction: DOWN
- tapOn: 'Instructions (optional)'
- inputText: 'Brace and press with a controlled descent'
- hideKeyboard
- scrollUntilVisible:
    element: 'Create and add'
    direction: DOWN
- tapOn: 'Create and add'
- scrollUntilVisible:
    element: 'Configure Native custom press exercise'
    direction: UP
- extendedWaitUntil:
    visible: 'Configure Native custom press exercise'
    timeout: 10000
- assertVisible: 'Strength'
- tapOn: 'Linear'
- scrollUntilVisible:
    element: 'Native custom press progression increment'
    direction: DOWN
- tapOn: 'Native custom press progression increment'
- inputText: '2.5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Native custom press minimum reps'
    direction: DOWN
- tapOn: 'Native custom press minimum reps'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Native custom press maximum reps'
    direction: DOWN
- tapOn: 'Native custom press maximum reps'
- inputText: '8'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target reps min'
    direction: DOWN
- tapOn: 'Target reps min'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target reps max'
    direction: DOWN
- tapOn: 'Target reps max'
- inputText: '8'
- hideKeyboard
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: 'Target load'
- inputText: '40'
- hideKeyboard
- assertVisible: 'Target load'
- pressKey: BACK
- scrollUntilVisible:
    element: 'Week'
    direction: UP
    visibilityPercentage: 50
- assertVisible: 'Week'
- tapOn: 'Monday Native Gym V2 typed routine'
- killApp
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    index: 0
- assertVisible: 'Monday Native Gym V2 typed routine'
- scrollUntilVisible:
    element: 'Your routines'
    direction: DOWN
    visibilityPercentage: 50
- assertVisible: 'Your routines'
- scrollUntilVisible:
    element: 'Open Native Gym V2 typed routine routine'
    direction: DOWN
    visibilityPercentage: 50
- tapOn: 'Open Native Gym V2 typed routine routine'
- tapOn: 'Configure Native custom press exercise'
- scrollUntilVisible:
    element: 'Target load'
    direction: DOWN
- assertVisible: 'Target load'
- assertVisible: '40'
- assertVisible: '5'
- assertVisible: '8'
