appId: com.dale16.superhabits
tags:
  - native
  - account-v1
  - auth-persistence
---
# On-device protection OTP flow against the hermetic local Auth mock —
# launch 3 of 3 (runs last, on 02-restart's anonymous state; no clearing): the
# anonymous session converts to a permanent account with the SAME user id
# (the mock server logs the id for the harness assertion). The mock OTP is
# always 123456.
- launchApp
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn: 'Open settings'
- scrollUntilVisible:
    element: 'Email for backup recovery'
    direction: DOWN
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 300
- tapOn: 'Email for backup recovery'
- inputText: 'canary@example.test'
- hideKeyboard
- tapOn: 'Protect backup with email'
- extendedWaitUntil:
    visible: 'Six-digit verification code'
    timeout: 20000
- scrollUntilVisible:
    element: 'Verification pending'
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: 'Backup protection verification code'
    direction: DOWN
    timeout: 20000
- tapOn: 'Backup protection verification code'
- inputText: '123456'
- hideKeyboard
- tapOn: 'Verify email'
- scrollUntilVisible:
    element: 'Protected'
    direction: UP
    timeout: 20000
- assertNotVisible: 'Account mismatch'
- killApp
