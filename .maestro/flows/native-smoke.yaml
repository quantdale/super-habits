appId: com.dale16.superhabits
tags:
  - native
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- assertVisible: 'Overview'
- swipe:
    direction: LEFT
- assertVisible: 'Todos'
- swipe:
    direction: LEFT
- assertVisible: 'Habits'
- swipe:
    direction: LEFT
- assertVisible: 'Start focus'
- swipe:
    direction: LEFT
- assertVisible: 'Workout'
- swipe:
    direction: LEFT
- assertVisible: 'Calories'
- swipe:
    direction: RIGHT
- assertVisible: 'Workout'
- swipe:
    direction: RIGHT
- assertVisible: 'Start focus'
- swipe:
    direction: RIGHT
- assertVisible: 'Habits'
- swipe:
    direction: RIGHT
- assertVisible: 'Todos'
- swipe:
    direction: RIGHT
- assertVisible: 'Overview'
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
- tapOn: 'Close settings'
- assertVisible: 'Overview'
