appId: com.dale16.superhabits
tags:
  - native
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 10000
- assertVisible: 'A compact snapshot of focus, habits, calories, todos, and workouts.'
- swipe:
    direction: LEFT
- assertVisible: "Today's queue"
- swipe:
    direction: LEFT
- assertVisible: 'Track daily consistency.'
- swipe:
    direction: LEFT
- assertVisible: 'Pomodoro'
- swipe:
    direction: LEFT
- assertVisible: 'Create simple routines and mark completions.'
- swipe:
    direction: LEFT
- assertVisible: 'Switch between manual entry and a diary grouped by meal.'
- swipe:
    direction: RIGHT
- assertVisible: 'Create simple routines and mark completions.'
- swipe:
    direction: RIGHT
- assertVisible: 'Pomodoro'
- swipe:
    direction: RIGHT
- assertVisible: 'Track daily consistency.'
- swipe:
    direction: RIGHT
- assertVisible: "Today's queue"
- swipe:
    direction: RIGHT
- assertVisible: 'A compact snapshot of focus, habits, calories, todos, and workouts.'
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
- tapOn: 'Close settings'
- assertVisible: 'A compact snapshot of focus, habits, calories, todos, and workouts.'
