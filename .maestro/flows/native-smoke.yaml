appId: com.dale16.superhabits
tags:
  - native
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Overview'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
# Current single-page shell: six sections behind the top tab rail.
# Markers mirror e2e/journeys SECTION_MARKERS (kept in sync with web journeys).
- assertVisible: 'Customize'
# index: 0 targets the tab-rail item — the rail renders before section
# content, whose stats/onboarding chips can repeat labels like Habits/Focus.
- tapOn:
    text: 'To Do'
    index: 0
- assertVisible: 'Offline-first task manager.'
- tapOn:
    text: 'Habits'
    index: 0
- assertVisible: "Today's rhythm"
- tapOn:
    text: 'Focus'
    index: 0
- assertVisible: 'Classic sequence: focus → short breaks → long break — durations saved on device.'
- tapOn:
    text: 'Workout'
    index: 0
# Fresh device (clearState): the Workout subtitle's has-activity variant is
# off, so the empty-state copy renders (WorkoutScreen.tsx conditional).
- assertVisible: 'Create simple routines and mark completions.'
- tapOn:
    text: 'Calories'
    index: 0
- assertVisible: 'Switch between manual entry and a diary grouped by meal.'
- tapOn:
    text: 'Overview'
    index: 0
- assertVisible: 'Customize'
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
- tapOn: 'Close settings'
- assertVisible: 'Customize'
