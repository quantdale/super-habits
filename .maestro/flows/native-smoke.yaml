appId: com.dale16.superhabits
tags:
  - native
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
# Current single-page shell: six sections behind the flat section switcher
# (floating bottom tab bar on phones, side rail on wide screens).
# Markers mirror e2e/journeys SECTION_MARKERS (kept in sync with web journeys).
# The redesigned Overview's customize control is an icon button (no visible
# text), so the always-rendered hero text "Plan today" is the marker.
- extendedWaitUntil:
    visible: 'Plan today'
    timeout: 10000
- assertNotVisible:
    text: '.*Expo Head: Add the handoff origin.*'
# Tab taps are scoped to the section switcher's "Section tabs" landmark:
# the bottom tab bar sits after section content in the native hierarchy, so an
# unscoped text match (e.g. "Today" in the Calories summary card header) can
# win index 0 and land on inert content instead of the tab.
# Settle waits before each section tap: on a slow emulator Maestro aims taps
# from a still-settling hierarchy and the tap lands on stale coordinates
# (Wave 8: tap COMPLETED on the right element but the section never
# activated). No assertion semantics change.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'To Do'
    childOf:
      text: 'Section tabs'
- extendedWaitUntil:
    visible: 'Offline-first task manager.'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Habits'
    childOf:
      text: 'Section tabs'
# Small screens fit only down to the day strip; the groups render below it.
- scrollUntilVisible:
    element: 'Anytime'
    direction: DOWN
- extendedWaitUntil:
    # The simplified Habits surface leads with time-of-day groups; the
    # Today's rhythm summary remains below the check-in controls.
    visible: 'Anytime'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Focus'
    childOf:
      text: 'Section tabs'
- extendedWaitUntil:
    visible: 'Classic sequence: focus → short breaks → long break — durations saved on device.'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Workout'
    childOf:
      text: 'Section tabs'
# Fresh device (clearState): the Workout subtitle's has-activity variant is
# off, so the current Gym V2 onboarding copy renders.
- extendedWaitUntil:
    visible: 'Build a training plan, start a guided workout, and track your progress.'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Calories'
    childOf:
      text: 'Section tabs'
- extendedWaitUntil:
    visible: 'Switch between manual entry and a diary grouped by meal.'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: 'Today'
    childOf:
      text: 'Section tabs'
# Return-visit render runs under full six-section mount plus Maestro polling
# load: Wave 8 failure dumps prove the tap navigates correctly and
# 'Plan today' renders with valid bounds, but after the 10s window. 30s
# matches the launch 'Today' budget above; assertions unchanged.
- extendedWaitUntil:
    visible: 'Plan today'
    timeout: 30000
- tapOn: 'Open settings'
- extendedWaitUntil:
    visible: 'Close settings'
    timeout: 5000
- tapOn: 'Close settings'
- assertVisible: 'Plan today'
