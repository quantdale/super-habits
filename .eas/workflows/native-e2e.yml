name: SuperHabits native E2E

# Mobile cloud runs are intentionally opt-in for pull requests. Add the
# `native-e2e` label or dispatch this workflow manually when native-sensitive
# changes require the platform gate.
on:
  workflow_dispatch: {}
  pull_request_labeled:
    labels:
      - native-e2e

jobs:
  # AUD-SH21-A: prove the build is hermetic BY CONFIGURATION before spending a
  # paid cloud build. The e2e-test profile blanks every public backend/remote-AI
  # variable and disables dotenv, so an account-level EAS environment value
  # cannot reach the artifact. This job re-checks that on the exact commit, and
  # fails before build_android/build_ios start.
  isolation_preflight:
    steps:
      - uses: eas/checkout

      - name: Verify credential-free cloud test configuration
        run: |
          set -euo pipefail
          node scripts/cloud-native-isolation.mjs
          node scripts/release-profile-guard.mjs

  build_android:
    needs: [isolation_preflight]
    type: build
    params:
      platform: android
      profile: e2e-test

  test_android:
    needs: [build_android]
    type: maestro
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/flows/native-smoke.yaml
        - .maestro/flows/todo-persistence.yaml
        - .maestro/flows/habit-persistence.yaml
        - .maestro/flows/habit-progress-insights.yaml
        - .maestro/flows/habit-reminder-actions.yaml
        - .maestro/flows/habit-reminder-actions-replay.yaml
        - .maestro/flows/calories-persistence.yaml
        - .maestro/flows/workout-persistence.yaml
        - .maestro/flows/workout-gym-v2-persistence.yaml
        - .maestro/flows/workout-gym-v2-session-lifecycle.yaml
        - .maestro/flows/settings-persistence.yaml
        - .maestro/flows/pomodoro-lifecycle.yaml
        - .maestro/flows/pomodoro-notification-path.yaml

  build_ios:
    needs: [isolation_preflight]
    type: build
    params:
      platform: ios
      profile: e2e-test

  test_ios:
    needs: [build_ios]
    type: maestro
    runs_on: macos-medium
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/flows/native-smoke.yaml
        - .maestro/flows/todo-persistence.yaml
        - .maestro/flows/habit-persistence.yaml
        - .maestro/flows/habit-progress-insights.yaml
        - .maestro/flows/habit-reminder-actions.yaml
        - .maestro/flows/habit-reminder-actions-replay.yaml
        - .maestro/flows/calories-persistence.yaml
        - .maestro/flows/workout-persistence.yaml
        - .maestro/flows/workout-gym-v2-persistence.yaml
        - .maestro/flows/workout-gym-v2-session-lifecycle.yaml
        - .maestro/flows/settings-persistence.yaml
        - .maestro/flows/pomodoro-lifecycle.yaml
        - .maestro/flows/pomodoro-notification-path.yaml
