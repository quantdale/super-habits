name: SuperHabits native E2E

# Mobile cloud runs are intentionally opt-in for pull requests. Add the
# `native-e2e` label or dispatch this workflow manually when native-sensitive
# changes require the platform gate.
on:
  workflow_dispatch: {}
  pull_request_labeled:
    labels:
      - native-e2e

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: e2e-test

  test_android:
    needs: [build_android]
    type: maestro
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/flows/native-smoke.yaml
        - .maestro/flows/todo-persistence.yaml
        - .maestro/flows/habit-persistence.yaml
        - .maestro/flows/calories-persistence.yaml
        - .maestro/flows/workout-persistence.yaml
        - .maestro/flows/settings-persistence.yaml
        - .maestro/flows/pomodoro-lifecycle.yaml
        - .maestro/flows/pomodoro-notification-path.yaml

  build_ios:
    type: build
    params:
      platform: ios
      profile: e2e-test

  test_ios:
    needs: [build_ios]
    type: maestro
    runs_on: macos-medium
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/flows/native-smoke.yaml
        - .maestro/flows/todo-persistence.yaml
        - .maestro/flows/habit-persistence.yaml
        - .maestro/flows/calories-persistence.yaml
        - .maestro/flows/workout-persistence.yaml
        - .maestro/flows/settings-persistence.yaml
        - .maestro/flows/pomodoro-lifecycle.yaml
        - .maestro/flows/pomodoro-notification-path.yaml
