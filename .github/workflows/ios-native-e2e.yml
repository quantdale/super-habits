name: iOS simulator E2E (GitHub Actions)

# A standard macOS runner is free for this public repository. Keep this label
# distinct from EAS's `native-e2e` label, which requires a paid Maestro plan.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  ios-simulator:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ios-simulator-gha') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 300
    env:
      CI: '1'
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      # Expo SDK 55 needs Xcode 26.2+; the runner image defaults to 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CODE_SIGNING_ALLOWED: 'NO'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_HABIT_REMINDER_E2E_TEST: 'true'
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify exact source and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v22.23.2'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          xcrun simctl list runtimes
          echo "Source SHA: $EXPECTED_SOURCE_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=2.2.0
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Boot iOS 26.2 Simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const devices = JSON.parse(input).devices;
              const matches = Object.entries(devices)
                .filter(([runtime]) => runtime.endsWith(".iOS-26-2"))
                .flatMap(([, entries]) => entries)
                .filter(device => device.name === "iPhone 17 Pro");
              if (matches.length !== 1) process.exit(1);
              process.stdout.write(matches[0].udid);
            });
          ')"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Simulator UDID: $simulator_id"

      - name: Prepare generated iOS workspace and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          (cd ios && pod install)
          workspace_path="$(find ios -maxdepth 2 -type d -name '*.xcworkspace' -print -quit)"
          test -n "$workspace_path"
          test -f "$workspace_path/contents.xcworkspacedata"
          echo "IOS_WORKSPACE=$GITHUB_WORKSPACE/$workspace_path" >> "$GITHUB_ENV"
          echo "Generated iOS workspace: $workspace_path"

      - name: Build unsigned Release app for iOS Simulator
        shell: bash
        timeout-minutes: 190
        run: |
          set -euo pipefail
          mkdir -p simulation-output/native
          derived_data="$RUNNER_TEMP/superhabits-ios-derived-data"
          build_log="$GITHUB_WORKSPACE/simulation-output/native/ios-xcodebuild-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          export RCT_NO_LAUNCH_PACKAGER=true
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme SuperHabits \
            -configuration Release \
            -destination "id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee "$build_log"
          app_path="$derived_data/Build/Products/Release-iphonesimulator/SuperHabits.app"
          test -d "$app_path"
          echo "IOS_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Record built iOS app provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$EXPECTED_SOURCE_SHA"
          plist="$IOS_APP_PATH/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          test "$bundle_id" = 'com.dale16.superhabits'
          test -f "$IOS_APP_PATH/$executable_name"
          executable_sha256="$(shasum -a 256 "$IOS_APP_PATH/$executable_name" | awk '{print $1}')"
          [[ "$executable_sha256" =~ ^[[:xdigit:]]{64}$ ]]
          export IOS_SOURCE_SHA="$source_sha"
          export IOS_BUNDLE_ID="$bundle_id"
          export IOS_BUNDLE_VERSION="$bundle_version"
          export IOS_SHORT_VERSION="$short_version"
          export IOS_EXECUTABLE_NAME="$executable_name"
          export IOS_EXECUTABLE_SHA256="$executable_sha256"
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const directory = path.resolve('simulation-output/native');
          mkdirSync(directory, { recursive: true });
          const report = {
            schemaVersion: 1,
            sourceSha: process.env.IOS_SOURCE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            appPath: process.env.IOS_APP_PATH,
            bundleIdentifier: process.env.IOS_BUNDLE_ID,
            bundleVersion: process.env.IOS_BUNDLE_VERSION,
            shortVersion: process.env.IOS_SHORT_VERSION,
            executableName: process.env.IOS_EXECUTABLE_NAME,
            executableSha256: process.env.IOS_EXECUTABLE_SHA256,
            capturedAt: new Date().toISOString(),
          };
          const filename = `ios-provenance-${report.runId}-${report.runAttempt}.json`;
          writeFileSync(path.join(directory, filename), `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Install Release app with simctl
        id: simctl_install
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test -d "$IOS_APP_PATH"
          node scripts/qa-ios-simctl.mjs install

      - name: Launch Release app with simctl
        id: simctl_launch
        shell: bash
        timeout-minutes: 3
        run: node scripts/qa-ios-simctl.mjs launch

      - name: Capture bounded iOS simulator diagnostics
        if: always() && (steps.simctl_install.outcome == 'failure' || steps.simctl_launch.outcome == 'failure')
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: node scripts/qa-ios-simctl.mjs diagnostics

      - name: Run iOS flows and print source/build provenance
        run: node scripts/qa-ios-github-actions.mjs "$IOS_APP_PATH"

      - name: Preserve iOS simulator reports and debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            simulation-output/native/*.json
            simulation-output/native/*.log
            simulation-output/native/debug-ios-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
