name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

# Edge functions (parse-ai-command, user-ai-ask) are deployed either through
# this workflow or locally with `supabase functions deploy <name>`. NEVER
# commit access tokens or put them in workflow files — they come from repo
# secrets only (Settings > Secrets and variables > Actions).
# Linked project at authoring time: ref kruubbynsmxzxfdunaal ("superhabits",
# from supabase/.temp/linked-project.json). Note: config.toml's `project_id`
# is the project NAME, not the ref the CLI needs; supabase/.temp/ is
# gitignored, so re-run `supabase link` locally if the project changes.

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message when the required secrets are missing.
      # SUPABASE_PROJECT_REF takes precedence; the linked project ref is the
      # fallback when it is discoverable in the checkout.
      - name: Verify secrets and resolve project ref
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing — add it under Settings > Secrets and variables > Actions. Never commit access tokens." >&2
            exit 1
          fi
          PROJECT_REF="${SUPABASE_PROJECT_REF:-}"
          # supabase/.temp/ is gitignored, so this only exists on a runner
          # where `supabase link` was run; the secret is the reliable path.
          if [ -z "$PROJECT_REF" ] && [ -f supabase/.temp/linked-project.json ]; then
            PROJECT_REF="$(node -p 'require("./supabase/.temp/linked-project.json").ref' 2>/dev/null || true)"
          fi
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF repo secret is missing (currently linked ref: kruubbynsmxzxfdunaal). Set the secret, or link the project locally and commit supabase/.temp/linked-project.json." >&2
            exit 1
          fi
          echo "project-ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy parse-ai-command
        run: supabase functions deploy parse-ai-command --project-ref "${{ steps.secrets.outputs.project-ref }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy user-ai-ask
        run: supabase functions deploy user-ai-ask --project-ref "${{ steps.secrets.outputs.project-ref }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
