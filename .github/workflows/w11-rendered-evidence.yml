name: W11 Rendered Evidence (temporary)
on:
  push:
    branches: [frontend-v3-w11-planning]
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check existing W11 evidence
        id: evidence
        run: |
          if [ -f docs/ui-ux/v3-audit/w11/.final-after-captured ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.evidence.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.evidence.outputs.skip == 'false'
        run: npm ci
      - name: Install Chromium
        if: steps.evidence.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium
      - name: Capture W11 baseline with unchanged planning source
        if: steps.evidence.outputs.skip == 'false' && hashFiles('docs/ui-ux/v3-audit/w11/before/390-projects-populated.png') == ''
        run: |
          git restore --source=6e5fc86496a0f657549104a227a46200d4fdf472 --staged --worktree -- \
            features/goals/GoalListView.tsx features/goals/GoalDetailView.tsx \
            features/projects/ProjectListView.tsx features/projects/ProjectDetailView.tsx \
            features/daily-plan/DailyPlanView.tsx
          rm -f features/planning-hub/PlanningSummaryRow.tsx
          npm run build:e2e
          VISUAL_AUDIT=1 VISUAL_AUDIT_OUTPUT_DIR=docs/ui-ux/v3-audit/w11/before \
            npx playwright test e2e/planning-w11-audit.spec.ts --project=chromium
        env:
          TZ: Asia/Manila
      - name: Capture W11 after on the current source
        if: steps.evidence.outputs.skip == 'false'
        run: |
          git restore --source=HEAD --staged --worktree -- \
            features/goals/GoalListView.tsx features/goals/GoalDetailView.tsx \
            features/projects/ProjectListView.tsx features/projects/ProjectDetailView.tsx \
            features/daily-plan/DailyPlanView.tsx \
            features/planning-hub/PlanningSummaryRow.tsx
          npm run build:e2e
          VISUAL_AUDIT=1 VISUAL_AUDIT_OUTPUT_DIR=docs/ui-ux/v3-audit/w11 \
            npx playwright test e2e/planning-w11-audit.spec.ts --project=chromium
        env:
          TZ: Asia/Manila
      - name: Commit captured evidence to isolated W11 branch
        if: steps.evidence.outputs.skip == 'false'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          touch docs/ui-ux/v3-audit/w11/.final-after-captured
          git add docs/ui-ux/v3-audit/w11
          git commit -m "test(w11): recapture final Planning UI across widths and themes"
          git push origin HEAD:frontend-v3-w11-planning
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: w11-rendered-capture-failure
          path: |
            docs/ui-ux/v3-audit/w11/
            .cursor/playwright-output/
          retention-days: 7
