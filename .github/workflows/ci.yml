name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Nightly platform lane (parent task 6.1 + `add-user-simulation-platform`
  # task 9.2, lane matrix in simulation/matrix.ts): full journeys + seeded
  # scenario mode + dist-sync build + disposable-backend lane. Runs on the
  # default branch only (schedules only fire there). 17:00 UTC is a quiet
  # hour in Asia/Manila (the TZ the suite runs under); the hour is a knob.
  schedule:
    - cron: '0 17 * * *'
  # Manual full-lane runs (AI exploratory / repro replay are on-demand).
  workflow_dispatch:

# Native Maestro/device jobs are intentionally defined in
# `.eas/workflows/native-e2e.yml` and run only by explicit dispatch or the
# `native-e2e` pull-request label. This web CI workflow remains credential-free
# and does not claim Android/iOS coverage.

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
# This prevents redundant runs when you push quick follow-up commits.
# The event type is part of the group so a nightly (schedule on refs/heads/main)
# is not cancelled by a main push and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # setup-node caches npm's download cache. npm ci always reconstructs
      # node_modules for this exact Node/lockfile/postinstall environment.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Supabase edge-function smoke check (parse-ai-command, user-ai-ask).
      # The entrypoints are plain JS importing only local relative modules —
      # no remote npm:/jsr: specifiers — so a direct `deno check` is
      # offline-stable and is the lightest invocation that still type-checks
      # the whole graph (the shared normalize.js helpers are fully checked;
      # the entrypoints run under their own @ts-nocheck). No deno.json exists
      # in the repo, so the check uses stock Deno 2 defaults.
      - name: Install Deno (edge-function smoke check)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase edge functions
        run: deno check supabase/functions/parse-ai-command/index.js supabase/functions/user-ai-ask/index.js

      - name: Lint
        run: npm run lint

      # Fast, hermetic contract gates that pair with lint: theme-token
      # validation against the registry and the openspec contract suite.
      # Kept before tests so drift fails early. (No Prettier gate here: the
      # repo is not yet prettier-clean repo-wide; formatting is enforced
      # incrementally by the lint-staged pre-commit hook instead.)
      - name: Validate theme tokens
        run: npm run validate:themes

      - name: Validate openspec contracts
        run: npm run openspec:validate

      # The same guard set `qa:fast` runs locally, so a main/nightly-only lane
      # cannot rot behind a green PR: journey-label parity (the rail labels the
      # E2E layer clicks) and quarantine-register parity (every gate site is
      # registered in docs/testing/known-gaps.md, per its standing rule).
      - name: Validate journey-label and quarantine-register parity
        run: node scripts/journey-label-parity.mjs && node scripts/quarantine-register-parity.mjs

      # Historical ExecPlans predate the versioned lifecycle and remain
      # discoverable without being CI-enforced. New Plan-Version: 2 plans must
      # be structurally valid before the quality tests run.
      - name: Validate versioned ExecPlans
        run: npm run agent:plan:validate:all

      # `npm test` is `vitest run`, which runs BOTH configured projects
      # (vitest.config.ts test.projects): the `unit` project AND the
      # real-SQLite `integration` project (parent task 2.4). No separate
      # test:integration invocation is needed; the explicit comment keeps
      # that fact visible (parent task 6.1).
      #
      # Non-UTC zone so the local-date-key logic in lib/time.ts is not only
      # ever exercised where local == UTC (parent task 2.10 needs it). Full
      # TZ/DST matrix is TST-001.
      - name: Test (unit + integration projects)
        run: npm run test
        env:
          TZ: Asia/Manila

      # Production-dependency advisory gate (production-closure Phase 8).
      # GATING: a NEW high or critical advisory in the production tree fails
      # here, so the "critical/high must be zero" policy is enforced rather than
      # asserted. The gate (`scripts/audit-runtime-deps.mjs`) reads
      # `npm audit --omit=dev --json`, prints EVERY high/critical finding, and
      # fails on any that is not in its dated, narrowly-scoped allowlist.
      #
      # Allowlisted (dated 2026-09-29, build-time-only): three `brace-expansion`
      # advisories reached through `test-exclude` (`babel-plugin-istanbul`,
      # coverage) and `glob@9` -> `minimatch@8`, with no non-breaking fix —
      # npm's only offered resolution is `react-native@0.87.1`. Neither module
      # is loaded by the web or native bundle. The 5.x copy IS fixed by an
      # `overrides` entry (`brace-expansion@^5.0.0` -> `^5.0.12`) and is not
      # allowlisted.
      #
      # Moderates stay report-only by the dated policy in
      # docs/testing/known-gaps.md (framework-owned: decode-uri-component via
      # expo-router's query-string chain — an override to 0.5.0 was REJECTED
      # 2026-09-24 as a semver-major swap under a pinned ^0.2 dependency with
      # untested URL-decode behavior; uuid via @expo/config-plugins -> xcode is
      # build-time only). Non-force fixes are applied as soon as they exist.
      - name: Audit runtime dependencies (gates on new high/critical)
        run: node scripts/audit-runtime-deps.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    # Lanes (see simulation/matrix.ts):
    #   - PR: journeys@pr (chromium feature suite + @p0 journey subset) and
    #     scenarios-pr (deterministic scenario subset, gates, ≤ 10 min budget).
    #   - main: journeys@main (full suite incl. full journeys + simulation
    #     self-test), scenarios-main (full deterministic library), dist-sync.
    #   - schedule: superseded by the `nightly` job below (avoids a double
    #     full-suite run); workflow_dispatch runs the main lane manually.
    # The disposable backend and the AI lane NEVER run here — forbidden
    # combinations in matrix.ts; dist-sync is main/nightly only (never PRs).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~130MB per download; cache them per Playwright
      # version. `install --with-deps` still runs for OS packages, but skips
      # the browser download on a cache hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Web export must exist before the E2E/server steps (Playwright
      # webServer only starts the static server; sim:run needs it too).
      - name: Build web export for E2E
        run: npm run build:e2e

      # ---- PR lane: fast, fake-backed, deterministic ----
      - name: Run feature E2E suite (lane journeys@pr — chromium project)
        id: playwright-chromium
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=chromium
        env:
          TZ: Asia/Manila

      # Retry-report gate (harden-ci-lane-integrity 5.2): CI runs with
      # `retries: 2`, so a timing ceiling (`≤ 800ms` section switch) or a row
      # oracle (one row or zero, never two) can fail attempt 1, pass attempt 2,
      # and still leave the lane exit 0. This gate reads the Playwright JSON
      # report of the invocation that just ran and fails the lane when a strict
      # assertion is among the retried-then-passed tests; flake-class retries
      # are listed without failing.
      #
      # Placement is deliberate: EVERY Playwright invocation REWRITES
      # report.json, so a single gate at the end of the job would only ever see
      # the last invocation's report. One gate per invocation, immediately
      # after it, so no lane's retries are overwritten unread.
      #
      # `always() && steps.<id>.outcome != 'skipped'` means "this lane actually
      # ran" — a lane that never ran (cancelled, or an earlier build failure)
      # is skipped, while a lane that ran and failed still gets its retries
      # reported. Deliberately no `continue-on-error`: a strict assertion that
      # only held on a retry is not a clean pass.
      - name: Retry-report gate — feature suite (strict assertions must not depend on a retry)
        if: always() && steps.playwright-chromium.outcome != 'skipped'
        run: node scripts/e2e-retry-report.mjs

      - name: Run P0 journey subset (lane journeys@pr — @p0, J1, J2a, J2b)
        id: playwright-p0
        if: github.event_name == 'pull_request'
        run: npm run e2e:journeys:p0
        env:
          TZ: Asia/Manila

      - name: Retry-report gate — P0 journey subset (strict assertions must not depend on a retry)
        if: always() && steps.playwright-p0.outcome != 'skipped'
        run: node scripts/e2e-retry-report.mjs

      - name: Validate simulation model + lane matrix (lane scenarios-pr)
        if: github.event_name == 'pull_request'
        run: npm run sim:validate

      # ---- main lane: full suite ----
      - name: Run full E2E suite incl. full journeys + simulation self-test (lane journeys@main)
        id: playwright-main
        if: github.event_name != 'pull_request'
        run: |
          set +e
          npm run e2e > /tmp/e2e.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo '::group::E2E failure summary'
            tail -120 /tmp/e2e.log
            echo '::endgroup::'
            grep -aE 'Error|error|failed|Timed out|webServer|ENOENT|Cannot find|throw|Expected:|Received:' /tmp/e2e.log | tail -40 | sed 's/^/::error::/'
            node -e "
              const fs = require('fs');
              const dir = 'test-results';
              if (!fs.existsSync(dir)) { console.log('::warning::no test-results dir'); process.exit(0); }
              for (const f of fs.readdirSync(dir)) {
                if (f.endsWith('.json')) continue;
                console.log('::error::E2E FAILURE DIR: ' + f);
              }
              try {
                const last = JSON.parse(fs.readFileSync(dir + '/.last-run.json', 'utf8'));
                console.log('::error::failedFiles=' + JSON.stringify(last.failedFiles || []));
              } catch (e) {
                console.log('::warning::no .last-run.json: ' + e.message);
              }
            "
          fi
          exit $code
        env:
          TZ: Asia/Manila

      # Same gate as the PR lane, for the main lane's single full-suite
      # invocation. It runs even when the suite itself failed, so a retried
      # strict assertion is still reported instead of being lost with the
      # failure summary.
      - name: Retry-report gate — full main suite (strict assertions must not depend on a retry)
        if: always() && steps.playwright-main.outcome != 'skipped'
        run: node scripts/e2e-retry-report.mjs

      # ---- scenario lane (deterministic; needs the served dist/) ----
      - name: Start static server for the scenario lane
        run: |
          node scripts/serve-e2e.js > /tmp/serve-e2e.log 2>&1 &
          echo $! > /tmp/serve-e2e.pid

      - name: Run deterministic scenario subset (lane scenarios-pr, ≤ 10 min budget)
        if: github.event_name == 'pull_request'
        run: |
          for i in $(seq 1 90); do curl -sf http://localhost:8081 >/dev/null 2>&1 && break; sleep 1; done
          npm run sim:run -- --mode deterministic --scenario @p0

      - name: Run full deterministic scenario library (lane scenarios-main)
        if: github.event_name != 'pull_request'
        run: |
          for i in $(seq 1 90); do curl -sf http://localhost:8081 >/dev/null 2>&1 && break; sleep 1; done
          npm run sim:run -- --mode deterministic

      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/serve-e2e.pid)" 2>/dev/null || true

      # ---- dist-sync build (parent task 6.1a, lane dist-sync) ----
      # Delegated to `npm run build:sync` (scripts/build-dist-sync.mjs): the
      # script exports dist-sync/ with the DUMMY Supabase env baked in
      # (EXPO_NO_DOTENV blocks any real .env from leaking in; non-routable
      # host, literal placeholder key), then verifies the dummy URL is in the
      # output and cleans a stale dist-sync/ first — the old inline export +
      # grep-verify steps, now shared with local runs. main/nightly ONLY —
      # never PRs, never the quality job; never real credentials. Consumed by
      # the dedicated `journeys-sync` Playwright project below (task 6.1a/Q5).
      - name: Build dist-sync/ with dummy Supabase env (lane dist-sync)
        if: github.event_name != 'pull_request'
        run: npm run build:sync

      # NOTE: the `journeys-sync` (e2e:sync) lane does NOT run here. The lane
      # table (simulation/matrix.ts) declares dist-sync `gates: false`, so a
      # gating run of it was a contradiction; it stays where the matrix puts
      # it — the nightly (report-only) job. The build above still runs so the
      # artifact is available for the upload below and for manual inspection.

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: .cursor/playwright-output/e2e-report/
          retention-days: 7

      # Platform run reports, failure digests, screenshots, traces and any
      # repro bundles (task 9.3) — same 7-day retention as e2e-report.
      - name: Upload simulation artifacts (run reports, digests, traces, repro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output
          path: simulation-output/
          retention-days: 7
          if-no-files-found: warn

      # dist-sync can only be absent when the build:sync step above already
      # failed — that step is the true signal, so a missing-artifact ERROR
      # here is a second red with no independent information (it fired
      # consequentially after the J8 gap-15 failure in run 35809827092).
      # warn still surfaces an unexpected absence without muddying triage.
      - name: Upload dist-sync build artifact
        if: github.event_name != 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: dist-sync
          path: dist-sync/
          retention-days: 7
          if-no-files-found: warn

  nightly:
    runs-on: ubuntu-latest
    needs: quality
    # Schedule-only superset of the e2e job: full journeys + seeded scenario
    # mode (scenarios-seeded) + dist-sync + the disposable-backend lane.
    # Non-gating by design (everything here is report-only).
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build web export for E2E
        run: npm run build:e2e

      - name: Run full suite incl. full journeys (lane journeys@nightly)
        id: playwright-nightly
        continue-on-error: true
        run: npm run e2e
        env:
          TZ: Asia/Manila

      # Report-only by design, matching this job's header and the lane table
      # (journeys@nightly `gates: false`): the gate lists every retried test and
      # still prints the strict-retry verdict, but `continue-on-error` keeps a
      # host-noise retry from turning the whole nightly job red. The same
      # verdict BLOCKS in the gating `e2e` job above.
      - name: Retry-report gate — nightly full suite (report-only)
        continue-on-error: true
        if: always() && steps.playwright-nightly.outcome != 'skipped'
        run: node scripts/e2e-retry-report.mjs

      - name: Start static server for the scenario lanes
        run: |
          node scripts/serve-e2e.js > /tmp/serve-e2e.log 2>&1 &
          echo $! > /tmp/serve-e2e.pid

      - name: Run seeded scenario lane (lane scenarios-seeded)
        continue-on-error: true
        run: |
          for i in $(seq 1 90); do curl -sf http://localhost:8081 >/dev/null 2>&1 && break; sleep 1; done
          npm run sim:run -- --mode seeded

      - name: Stop static server
        if: always()
        run: kill "$(cat /tmp/serve-e2e.pid)" 2>/dev/null || true

      # Delegated to `npm run build:sync` (scripts/build-dist-sync.mjs) — the
      # script exports dist-sync/ with the dummy Supabase env baked in and
      # verifies the dummy URL is in the output (was two inline steps).
      - name: Build dist-sync/ with dummy Supabase env (lane dist-sync)
        run: npm run build:sync

      # ---- dist-sync lane (parent task 6.1a / Q5) ----
      # The dedicated journeys-sync Playwright project runs the remote-boundary
      # journeys (J3/J4/J5, tagged @sync) against dist-sync/ on :8082. Nightly
      # is non-gating by design (report-only), but the lane still runs so the
      # remote-boundary branches are exercised on the schedule.
      - name: Run remote-boundary journey lane against dist-sync/ (lane dist-sync)
        id: playwright-sync
        continue-on-error: true
        run: npm run e2e:sync
        env:
          TZ: Asia/Manila

      # Second Playwright invocation in this job: it rewrites report.json, so it
      # gets its own gate read of the report it produced (same report-only
      # posture as the nightly gate above).
      - name: Retry-report gate — remote-boundary lane (report-only)
        continue-on-error: true
        if: always() && steps.playwright-sync.outcome != 'skipped'
        run: node scripts/e2e-retry-report.mjs

      # ---- disposable-backend lane (lane disposable-backend) ----
      # Runs ONLY when a Supabase access token is configured as a repo secret;
      # otherwise this step is skipped and nightly stays green with the lane
      # visibly "not configured". The condition reads the `secrets` context
      # directly: `env.SUPABASE_ACCESS_TOKEN` was never populated (step-level
      # `env:` does not feed a step's own `if:`), so the lane could never run
      # even with the secret set. The token is mapped into the step's `env:`
      # block so `simulation/backend/provision.ts` receives it. The
      # hard-isolation guard (guard.ts / provision.ts check /
      # build-dist-live.sh) runs BEFORE any build or network call and aborts
      # non-zero if a rule fires. Round-trip scenario execution against
      # dist-live/ (roundTripScenarios.ts) is task 8.5 wiring — pending; the
      # next nightly's create-or-wipe cleans up the previous project (task 8.2
      # semantics). A skipped step reports as "not configured" in the run
      # summary; a configured-but-failing step reports its failure.
      - name: Disposable-backend lane (guarded; needs SUPABASE_ACCESS_TOKEN)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SIMULATION_PRODUCTION_SUPABASE_HOSTS: ${{ vars.SIMULATION_PRODUCTION_SUPABASE_HOSTS }}
        run: |
          set -euo pipefail
          npx tsx simulation/backend/provision.ts run --with-parser --no-teardown
          bash simulation/backend/build-dist-live.sh
          test -f dist-live/index.html && echo "dist-live/ produced by the guarded job (never committed; gitignored)."

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-nightly
          path: .cursor/playwright-output/e2e-report/
          retention-days: 7

      - name: Upload simulation artifacts (run reports, digests, traces, repro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output-nightly
          path: simulation-output/
          retention-days: 7
          if-no-files-found: warn

      # Same rationale as the push-lane upload: upstream build failure is
      # the real signal; warn keeps an unexpected absence visible without a
      # redundant second red (2026-09-23 adversarial finding H).
      - name: Upload dist-sync build artifact
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: dist-sync-nightly
          path: dist-sync/
          retention-days: 7
          if-no-files-found: warn
